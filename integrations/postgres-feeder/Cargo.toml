[package]
name = "knotrel-pg-feeder"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.100.0"
license = "Elastic-2.0"
repository = "https://github.com/knotrel/knotrel"
description = "Reference PostgreSQL logical-replication feeder for a Knotrel server in source-managed mode"
publish = false

# A separate workspace: the feeder has its own dependencies and lockfile and is
# never part of the Knotrel server build.
[workspace]

[dependencies]
pgwire-replication = { version = "0.5.0", default-features = false, features = ["scram"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
