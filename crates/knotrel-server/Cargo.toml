[package]
name = "knotrel-server"
description = "HTTP API for the Knotrel connectivity engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

[features]
default = []
