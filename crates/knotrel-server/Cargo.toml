[package]
name = "knotrel-server"
description = "HTTP API for the Knotrel connectivity engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

[features]
default = []
# Internal testing-only instrumentation feature for lifecycle and worker fault-injection.
# Unsupported for production use and disabled by default.
test-support = []

[dependencies]
knotrel-core.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc.workspace = true
parking_lot.workspace = true
simd-json.workspace = true
sonic-rs.workspace = true
serde_json.workspace = true
mime.workspace = true
prometheus-client.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
tower.workspace = true

# docs/compatibility.md, section 6: maintainer-approved breaking changes.
# Each lint below has a [[semver_exception]] entry in
# docs/api/public-api-policy.toml naming its items, decision and release
# ("until"); scripts/public-api.py fails once the workspace version is past
# that release, so the entry and the lint must then be removed. The lint is
# crate-wide: the public API snapshot, the approved #[non_exhaustive] list and
# the narrowing check of the same script remain the per-item guard.
[package.metadata.cargo-semver-checks.lints]
enum_marked_non_exhaustive = "allow"

[lints]
workspace = true
