[package]
name = "knotrel-server"
description = "HTTP API for the Knotrel connectivity engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish.workspace = true

[features]
default = []
# Internal testing-only instrumentation feature for lifecycle and worker fault-injection.
# Unsupported for production use and disabled by default.
test-support = []

[dependencies]
knotrel-core.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc.workspace = true
parking_lot.workspace = true
simd-json.workspace = true
sonic-rs.workspace = true
serde_json.workspace = true
mime.workspace = true
prometheus-client.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
tower.workspace = true

# docs/compatibility.md, section 6: maintainer-approved breaking changes.
#
# v1.0.0 contract freeze (docs/releases/v1.0-contract-freeze-review.md, R2,
# maintainer decision 1 of 2026-11-22): `Phase` becomes `#[non_exhaustive]`
# against the v0.9.0 baseline. No deprecation path exists for this attribute.
# cargo-semver-checks configures lints per crate, not per item, so the lint is
# allowed for this crate only while the baseline predates v1.0.0;
# docs/api/public-api-knotrel-server.txt records `#[non_exhaustive]` on every
# item, so any further change of the attribute still shows up in review.
# Remove this entry in the first change after v1.0.0 is tagged.
[package.metadata.cargo-semver-checks.lints]
enum_marked_non_exhaustive = "allow"

[lints]
workspace = true
