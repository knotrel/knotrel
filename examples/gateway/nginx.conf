# TLS-terminating, authenticating gateway in front of Knotrel and the console
# (roadmap 0.9.5; docs/deployment.md, "Gateway with TLS and authentication").
#
# Shares the Knotrel container's network namespace: Knotrel listens on
# 127.0.0.1:9080 and the console on 127.0.0.1:8080 only inside it; this
# gateway is the only published listener (8443, TLS).
#
# Authorization, by credential file:
#   operators  console UI and the query/operation API (/v1/*, probes, metrics)
#   feeders    the feeder routes (/v1/feeder/*) and the probes they need
# Neither can use the other's routes.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream knotrel {
        server 127.0.0.1:9080;
    }
    upstream console {
        server 127.0.0.1:8080;
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/knotrel-gateway/tls/server.crt;
        ssl_certificate_key /etc/knotrel-gateway/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:knotrel_tls:1m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Knotrel's own request limit; imports have their own below.
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;

        # Feeder routes: feeder credentials only.
        location /v1/feeder/ {
            auth_basic "knotrel feeder";
            auth_basic_user_file /etc/knotrel-gateway/auth/feeders;
            client_max_body_size 64m;
            proxy_set_header Host $http_host;
            proxy_pass http://knotrel;
        }

        # Query and operation API, inspection and metrics: operators only.
        location /v1/ {
            auth_basic "knotrel";
            auth_basic_user_file /etc/knotrel-gateway/auth/operators;
            proxy_set_header Host $http_host;
            proxy_pass http://knotrel;
        }
        location = /metrics {
            auth_basic "knotrel";
            auth_basic_user_file /etc/knotrel-gateway/auth/operators;
            proxy_pass http://knotrel;
        }

        # Probes: either credential (a feeder watches readiness too).
        location ~ ^/(health|ready)$ {
            auth_basic "knotrel";
            auth_basic_user_file /etc/knotrel-gateway/auth/probes;
            proxy_pass http://knotrel;
        }

        # Everything else is the console: operators only. The console applies
        # its own route allowlist and Host/Origin checks behind this.
        location / {
            auth_basic "knotrel console";
            auth_basic_user_file /etc/knotrel-gateway/auth/operators;
            proxy_set_header Host $http_host;
            proxy_pass http://console;
        }
    }
}
