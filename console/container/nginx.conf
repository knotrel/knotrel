# Main configuration of the knotrel-console image (nginx, unprivileged).
# Writable paths are confined to /tmp so the container can run with a read-only
# root filesystem and a tmpfs at /tmp.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Method, path without query string, status, size and duration only: no
    # request or response bodies, headers, cookies or credentials.
    log_format knotrel '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout knotrel;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 5s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 64k;

    # Rendered at startup from /etc/nginx/knotrel/templates by
    # /docker-entrypoint.d/15-knotrel-console.sh.
    include /tmp/knotrel-console/*.conf;
}
