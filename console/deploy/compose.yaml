# Local start: a Knotrel server (standalone, lifecycle enabled) and the console.
#
#   docker compose -f console/deploy/compose.yaml up --build
#   open http://127.0.0.1:7380/
#
# Only the console is published, and only on loopback. The server is reachable
# solely from the console container on the private Compose network. For remote
# access put a gateway with TLS and authentication in front of the console; see
# docs/console.md. Graph state is in memory and lost when the server stops.
#
# Both images are built from this repository. After a published release you can
# replace the console build with: image: ghcr.io/knotrel/knotrel-console:<version>
name: knotrel-console-local

services:
  knotrel:
    build:
      context: ../..
      dockerfile: examples/container/Dockerfile
    image: knotrel-server:example
    environment:
      KNOTREL_MODE: standalone
      KNOTREL_TOPOLOGY_LIFECYCLE: 'true'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  console:
    build:
      context: ..
    image: knotrel-console:local
    environment:
      KNOTREL_UPSTREAM: http://knotrel:8080
    ports:
      - '127.0.0.1:7380:8080'
    depends_on:
      knotrel:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
