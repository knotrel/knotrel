# Example same-origin gateway for the Knotrel console static archive (nginx).
#
# Serve the archive's html/ directory and forward only the console's API routes
# to one Knotrel server. Replace the three EXAMPLE values. TLS and access control
# are your gateway's responsibility: the console adds no authentication, and the
# Knotrel API has none. Do not expose this without both.
#
# The console calls its API through the relative prefix "api/", so it works at
# "/" or under a sub-path (move every location under that prefix).

server {
    listen 443 ssl;
    server_name console.example.internal;                  # EXAMPLE
    ssl_certificate     /etc/ssl/certs/console.pem;          # EXAMPLE
    ssl_certificate_key /etc/ssl/private/console.key;        # EXAMPLE

    # --- Access control (required for anything but a trusted single user) ---
    # For example: auth_request to your SSO, client certificates, or
    # allow/deny for a management network. Applies to the UI and the API.
    # auth_request /_sso;

    root /srv/knotrel-console/html;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/index.html =404;
    }

    # Only these routes; feeder endpoints stay private.
    location /api/ { return 404; }
    location = /api/health     { limit_except GET  { deny all; } proxy_pass http://127.0.0.1:8080/health; }      # EXAMPLE upstream
    location = /api/ready      { limit_except GET  { deny all; } proxy_pass http://127.0.0.1:8080/ready; }
    location = /api/v1/info    { limit_except GET  { deny all; } proxy_pass http://127.0.0.1:8080/v1/info; }
    location = /api/v1/stats   { limit_except GET  { deny all; } proxy_pass http://127.0.0.1:8080/v1/stats; }
    location = /api/v1/operations { limit_except POST { deny all; } proxy_pass http://127.0.0.1:8080/v1/operations; }
    location = /api/v1/batch   { limit_except POST { deny all; } client_max_body_size 1m; proxy_pass http://127.0.0.1:8080/v1/batch; }
    location = /api/metrics    { limit_except GET  { deny all; } proxy_pass http://127.0.0.1:8080/metrics; }
    location = /api/v1/nodes   { limit_except GET  { deny all; } proxy_pass http://127.0.0.1:8080/v1/nodes; }
    location = /api/v1/edges   { limit_except GET  { deny all; } proxy_pass http://127.0.0.1:8080/v1/edges; }
    location ~ ^/api/v1/nodes/[0-9]+(/edges)?$ {
        limit_except GET { deny all; }
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;
    }

    # Applies to the proxied locations above.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_next_upstream off;          # never replay a mutation
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;           # above the server's 30 s request timeout
    proxy_hide_header Set-Cookie;
}
