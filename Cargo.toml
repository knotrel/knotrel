[workspace]
members = ["crates/knotrel-core", "crates/knotrel-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
repository = "https://github.com/knotrel/knotrel"
publish = false

[workspace.dependencies]
knotrel-core = { path = "crates/knotrel-core" }
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustc-hash = "2.1"
mimalloc = { version = "0.1", default-features = false }
parking_lot = "0.12"
simd-json = "0.14"
tinyvec = { version = "1.8", features = ["alloc"] }
nohash-hasher = "0.2"
fixedbitset = "0.5"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
