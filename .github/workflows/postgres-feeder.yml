name: postgres-feeder

# The reference PostgreSQL feeder (integrations/postgres-feeder): its own
# Cargo workspace, checked here and tested against real PostgreSQL servers.
on:
  push:
    branches:
      - main
    paths:
      - 'integrations/postgres-feeder/**'
      - 'examples/postgres-feeder/**'
      - 'crates/**'
      - 'Cargo.lock'
      - 'docs/integrations/**'
      - '.github/workflows/postgres-feeder.yml'
  pull_request:
    paths:
      - 'integrations/postgres-feeder/**'
      - 'examples/postgres-feeder/**'
      - 'crates/**'
      - 'Cargo.lock'
      - 'docs/integrations/**'
      - '.github/workflows/postgres-feeder.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.100.0

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/postgres-feeder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: integrations/postgres-feeder -> target
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.19.0
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - name: Unit tests
        run: cargo test --locked --lib --bins --examples
      - name: Dependencies (licenses, advisories, sources)
        run: cargo deny --locked check --config ../../deny.toml licenses advisories bans sources
      - name: Shell scripts
        run: bash -n scripts/*.sh ../../examples/postgres-feeder/*.sh ../../examples/postgres-feeder/initdb/*.sh

  integration:
    name: integration (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16', '17', '18', '19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            integrations/postgres-feeder -> target
      - name: Build knotrel-server
        run: cargo build --locked --bin knotrel-server
      # The upgrade test (docs/deployment.md, "Upgrade between minor versions")
      # runs once, on PostgreSQL 18, against the previous release's server.
      - name: Build the previous release's knotrel-server
        if: matrix.postgres == '18'
        shell: bash
        run: |
          head="$(git rev-parse HEAD)"
          tag=""
          for t in $(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname); do
            [[ "$t" == *-* ]] && continue
            [[ "$(git rev-list -n 1 "$t")" == "$head" ]] && continue
            tag="$t"; break
          done
          [[ -n "$tag" ]] || { echo "::error::no previous release tag"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/previous" "$tag"
          cargo build --locked --bin knotrel-server --manifest-path "$RUNNER_TEMP/previous/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/previous-target"
          echo "KNOTREL_PREVIOUS_BIN=$RUNNER_TEMP/previous-target/debug/knotrel-server" >> "$GITHUB_ENV"
          echo "KNOTREL_UPGRADE_TEST_REQUIRED=1" >> "$GITHUB_ENV"
          echo "Upgrade test from $tag" 
      - name: Build the feeder and its tests
        working-directory: integrations/postgres-feeder
        run: cargo test --locked --no-run
      - name: Start PostgreSQL ${{ matrix.postgres }}
        working-directory: integrations/postgres-feeder
        run: |
          url="$(scripts/start-test-postgres.sh '${{ matrix.postgres }}')"
          echo "::add-mask::${url}"
          echo "KNOTREL_PG_ADMIN_URL=${url}" >> "$GITHUB_ENV"
      - name: Integration tests
        working-directory: integrations/postgres-feeder
        env:
          KNOTREL_PG_TESTS_REQUIRED: '1'
        run: cargo test --locked -- --nocapture
      - name: PostgreSQL log
        if: failure()
        run: docker logs 'knotrel-pg-test-${{ matrix.postgres }}' 2>&1 | tail -200
      - name: Feeder logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feeder-logs-pg${{ matrix.postgres }}
          path: integrations/postgres-feeder/target/feeder-test-logs/
          retention-days: 7
