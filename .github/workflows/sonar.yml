name: sonar

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.100.0
    steps:
      # Without SONAR_TOKEN (fork pull requests, unconfigured repositories) no
      # analysis happens. The job then succeeds but records "skipped" in its
      # summary: a skipped scan is not a passed quality gate.
      - name: Report skipped analysis
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SonarCloud analysis SKIPPED: SONAR_TOKEN is not available to this run." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: env.SONAR_TOKEN != ''
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.SONAR_TOKEN != ''
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        if: env.SONAR_TOKEN != ''
        with:
          tool: cargo-llvm-cov
      - name: Generate Rust coverage
        if: env.SONAR_TOKEN != ''
        run: bash scripts/coverage.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SONAR_TOKEN != ''
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Generate console coverage
        if: env.SONAR_TOKEN != ''
        working-directory: console
        run: |
          npm ci --no-audit --no-fund
          npm run test:coverage
      - name: Require both coverage reports and derive the version
        if: env.SONAR_TOKEN != ''
        id: prepare
        run: |
          test -s lcov.info || { echo "::error::Rust lcov.info missing"; exit 1; }
          test -s console/coverage/lcov.info || { echo "::error::console LCOV missing"; exit 1; }
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Wait for the quality gate: the step fails when the gate fails, so an
          # uploaded analysis is never mistaken for a passed gate.
          args: >
            -Dsonar.projectVersion=${{ steps.prepare.outputs.version }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Report analysis result
        if: env.SONAR_TOKEN != ''
        run: echo "SonarCloud analysis uploaded and quality gate passed." | tee -a "$GITHUB_STEP_SUMMARY"
