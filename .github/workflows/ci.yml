name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.100.0
  CORE_MSRV: 1.98.1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --workspace --locked
      - name: Build (release)
        run: cargo build --workspace --release --locked
      # The core's randomized invariant tests run with optimizations (debug
      # assertions and overflow checks stay on); the release workflow uses the
      # same flags. Release builds and coverage are unaffected.
      - name: Run tests (workspace)
        shell: bash
        run: cargo test --workspace --locked --config 'profile.test.package."knotrel-core".opt-level=2'
      # `test-support` only affects knotrel-server, so only its tests rerun.
      - name: Run tests (test-support)
        shell: bash
        run: cargo test -p knotrel-server --locked --features test-support --config 'profile.test.package."knotrel-core".opt-level=2'
      # ADR 0014, CF4: the process-lifecycle, import, feeder-event, batch and
      # bootstrap suites again with the experimental cluster-forest engine
      # (plain mode; topology lifecycle on cluster-forest is covered by the
      # topology, inspection and process suites in the steps above).
      - name: Run server suites (cluster-forest)
        shell: bash
        env:
          KNOTREL_TEST_ENGINE: cluster-forest
        run: cargo test -p knotrel-server --locked --features test-support --config 'profile.test.package."knotrel-core".opt-level=2' --test lifecycle --test import --test events --test batch --test bootstrap
      - name: Run example (basic)
        run: cargo run -p knotrel-core --example basic
      - name: Run example (bulk_import)
        run: cargo run -p knotrel-core --example bulk_import
      - name: Run example (engine_selection)
        run: cargo run -p knotrel-core --example engine_selection
      - name: Run README network quickstart (unix)
        if: runner.os != 'Windows'
        run: python3 examples/quickstart/network_demo.py target/release/knotrel-server
      - name: Run README network quickstart (windows)
        if: runner.os == 'Windows'
        run: python examples/quickstart/network_demo.py target/release/knotrel-server.exe
      - name: Run release binary smoke test (unix)
        if: runner.os != 'Windows'
        run: ./scripts/smoke-test-release-binary.sh target/release/knotrel-server
      - name: Run release binary smoke test (windows)
        if: runner.os == 'Windows'
        run: powershell -File ./scripts/smoke-test-release-binary.ps1 -BinaryPath target/release/knotrel-server.exe

  api-compatibility:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-semver-checks@0.51.0
      # The previous stable release: the newest v* tag reachable from HEAD,
      # excluding release candidates and a tag on HEAD itself.
      - name: Find the previous release
        id: base
        shell: bash
        run: |
          head="$(git rev-parse HEAD)"
          tag=""
          for t in $(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname); do
            [[ "$t" == *-* ]] && continue
            [[ "$(git rev-list -n 1 "$t")" == "$head" ]] && continue
            tag="$t"; break
          done
          [[ -n "$tag" ]] || { echo "::error::no previous release tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Comparing against $tag"
      # docs/compatibility.md, section 6: breaking changes to the public Rust
      # API always fail; an approved one is declared in the crate's
      # cargo-semver-checks lint configuration, reviewed with the change.
      - name: Public Rust API (cargo-semver-checks)
        run: cargo semver-checks check-release --workspace --baseline-rev "${{ steps.base.outputs.tag }}" --release-type minor
      - name: HTTP API (OpenAPI compatibility)
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi-compat"
          "$RUNNER_TEMP/openapi-compat/bin/pip" install -r scripts/requirements-openapi.txt
          git show "${{ steps.base.outputs.tag }}:docs/openapi.yaml" > "$RUNNER_TEMP/openapi-base.yaml"
          "$RUNNER_TEMP/openapi-compat/bin/python" tests/test_openapi_compat.py
          "$RUNNER_TEMP/openapi-compat/bin/python" scripts/check-openapi-compat.py \
            "$RUNNER_TEMP/openapi-base.yaml" docs/openapi.yaml \
            --approved docs/api/approved-breaking-changes.yaml

  core-msrv:
    name: core MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.CORE_MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test core on MSRV
        run: cargo +${{ env.CORE_MSRV }} test -p knotrel-core --locked

  # docs/compatibility.md, section 6: the committed public API snapshot must
  # equal the code, every public item must have an explicit class in
  # docs/api/public-api-classification.txt, and docs/stability.md must agree.
  # rustdoc JSON is unstable output: scripts/public-api.py enables it on the
  # pinned toolchain for its own rustdoc runs and checks the format version.
  public-api:
    name: public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The narrowing check compares the classification with the base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test the checker
        run: python3 tests/test_public_api.py
      # Base: the pull request's base branch; on a push, the previous tip.
      - name: Public API snapshot and classification
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then BASE=HEAD~1; fi
          python3 scripts/public-api.py check --base "$BASE"

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  package-verify:
    name: package-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify reproducible source packaging
        run: ./scripts/verify-source-packages.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Validate OpenAPI and API coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi-validation"
          "$RUNNER_TEMP/openapi-validation/bin/pip" install -r scripts/requirements-openapi.txt
          "$RUNNER_TEMP/openapi-validation/bin/python" tests/test_openapi_contract.py
      - name: Crate documentation policy
        run: |
          python3 scripts/check-crate-docs.py
          python3 tests/test_crate_documentation.py
      - name: README versions
        run: |
          python3 scripts/check-readme.py
          python3 tests/test_readme_check.py
      - name: Reproducible-build comparer
        run: python3 tests/test_compare_binaries.py
      - name: Server's knotrel-core requirement
        run: |
          python3 scripts/check-core-pin.py
          python3 tests/test_core_pin.py
      - name: Documentation examples
        run: cargo test --workspace --doc --locked --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked --all-features --document-private-items
