name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.100.0
  CORE_MSRV: 1.98.1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --workspace --locked
      - name: Build (release)
        run: cargo build --workspace --release --locked
      # The core's randomized invariant tests run with optimizations (debug
      # assertions and overflow checks stay on); the release workflow uses the
      # same flags. Release builds and coverage are unaffected.
      - name: Run tests (workspace)
        shell: bash
        run: cargo test --workspace --locked --config 'profile.test.package."knotrel-core".opt-level=2'
      # `test-support` only affects knotrel-server, so only its tests rerun.
      - name: Run tests (test-support)
        shell: bash
        run: cargo test -p knotrel-server --locked --features test-support --config 'profile.test.package."knotrel-core".opt-level=2'
      - name: Run example (basic)
        run: cargo run -p knotrel-core --example basic
      - name: Run example (bulk_import)
        run: cargo run -p knotrel-core --example bulk_import
      - name: Run example (engine_selection)
        run: cargo run -p knotrel-core --example engine_selection
      - name: Run README network quickstart (unix)
        if: runner.os != 'Windows'
        run: python3 examples/quickstart/network_demo.py target/release/knotrel-server
      - name: Run README network quickstart (windows)
        if: runner.os == 'Windows'
        run: python examples/quickstart/network_demo.py target/release/knotrel-server.exe
      - name: Run release binary smoke test (unix)
        if: runner.os != 'Windows'
        run: ./scripts/smoke-test-release-binary.sh target/release/knotrel-server
      - name: Run release binary smoke test (windows)
        if: runner.os == 'Windows'
        run: powershell -File ./scripts/smoke-test-release-binary.ps1 -BinaryPath target/release/knotrel-server.exe

  core-msrv:
    name: core MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.CORE_MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test core on MSRV
        run: cargo +${{ env.CORE_MSRV }} test -p knotrel-core --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  package-verify:
    name: package-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify reproducible source packaging
        run: ./scripts/verify-source-packages.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Crate documentation policy
        run: |
          python3 scripts/check-crate-docs.py
          python3 tests/test_crate_documentation.py
      - name: Documentation examples
        run: cargo test --workspace --doc --locked --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked --all-features --document-private-items
