name: sbom

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
      - run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          rm -rf sbom
          mkdir -p sbom
          cargo cyclonedx --manifest-path Cargo.toml --format json --all-features --target all --override-filename workspace-sbom
          find . -name 'workspace-sbom.json' -print | while IFS= read -r file; do
            relative_dir=$(dirname "${file#./}")
            if [[ "$relative_dir" == "." ]]; then
              relative_dir="workspace-root"
            fi
            relative_dir=$(printf '%s' "$relative_dir" | tr '/' '-')
            cp "$file" "sbom/${relative_dir}-workspace-sbom.json"
          done
          [[ -n "$(find sbom -type f -name '*.json' -print -quit)" ]]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knotrel-sbom
          path: sbom/
          if-no-files-found: error
