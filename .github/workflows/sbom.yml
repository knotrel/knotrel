name: sbom

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          rm -rf sbom
          mkdir -p sbom
          cargo cyclonedx --manifest-path Cargo.toml --format json --all-features --target all --override-filename workspace-sbom
          find . -name 'workspace-sbom.json' -print | while IFS= read -r file; do
            relative_dir=$(dirname "${file#./}")
            if [[ "$relative_dir" == "." ]]; then
              relative_dir="workspace-root"
            fi
            relative_dir=$(printf '%s' "$relative_dir" | tr '/' '-')
            cp "$file" "sbom/${relative_dir}-workspace-sbom.json"
          done
          [[ -n "$(find sbom -type f -name '*.json' -print -quit)" ]]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knotrel-sbom
          path: sbom/
          if-no-files-found: error
