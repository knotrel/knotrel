name: sbom

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
      - run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          rm -rf sbom
          mkdir -p sbom
          cargo cyclonedx --manifest-path Cargo.toml --format json --all-features --target all --override-filename workspace-sbom
          find . -name 'workspace-sbom.json' -print | while IFS= read -r file; do
            relative_dir=$(dirname "${file#./}")
            if [[ "$relative_dir" == "." ]]; then
              relative_dir="workspace-root"
            fi
            relative_dir=$(printf '%s' "$relative_dir" | tr '/' '-')
            cp "$file" "sbom/${relative_dir}-workspace-sbom.json"
          done
          [[ -n "$(find sbom -type f -name '*.json' -print -quit)" ]]
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: knotrel-sbom
          path: sbom/
          if-no-files-found: error
