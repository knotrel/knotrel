name: sbom

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          rm -rf sbom
          mkdir -p sbom
          cargo cyclonedx --manifest-path Cargo.toml --format json --all-features --target all --override-filename workspace-sbom
          find . -name 'workspace-sbom.json' -print | while IFS= read -r file; do
            relative_dir=$(dirname "${file#./}")
            if [[ "$relative_dir" == "." ]]; then
              relative_dir="workspace-root"
            fi
            relative_dir=$(printf '%s' "$relative_dir" | tr '/' '-')
            cp "$file" "sbom/${relative_dir}-workspace-sbom.json"
          done
          [[ -n "$(find sbom -type f -name '*.json' -print -quit)" ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knotrel-sbom
          path: sbom/
          if-no-files-found: error
