version: 2
updates:
  # Maintain dependencies for Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"

  # Maintain npm development dependencies of the operational console
  - package-ecosystem: "npm"
    directory: "/console"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      console-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is not yet supported by typescript-eslint (<6.1) or
      # openapi-typescript (^5). Remove once both accept it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "console"

  # Maintain the console container base images (digest-pinned)
  - package-ecosystem: "docker"
    directory: "/console"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "console"
