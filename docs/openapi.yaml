  /v1/nodes:
    get:
      x-knotrel-stability: experimental
      operationId: list_nodes
      summary: List nodes in ascending ID order (inspection)
      tags:
        - Inspection
      description: |
        Read-only inspection route, enabled by `KNOTREL_INSPECTION=true` (otherwise 409
        `inspection_disabled`, before admission). Works with every engine. Runs like
        `GET /v1/stats`: bounded admission, blocking worker, shared graph lock, no readiness
        gate, available in both modes. Each page is computed under one lock acquisition and
        carries the version headers of that instant; pages are not a snapshot. A node present
        for the whole traversal is returned exactly once; nodes added or removed meanwhile may
        or may not appear. A page examines at most 10000 nodes, so it may hold fewer than
        `limit` items while `next_after` is non-null. Restart when `X-Knotrel-Instance-Id` or
        `X-Knotrel-Generation` changes between pages.
      parameters:
        - $ref: '#/components/parameters/InspectionAfter'
        - $ref: '#/components/parameters/InspectionLimit'
        - name: state
          in: query
          required: false
          description: Node filter. Without lifecycle support every node is active.
          schema:
            type: string
            enum: [all, active, inactive]
            default: all
      responses:
        '200':
          description: One page of nodes
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              $ref: '#/components/headers/ETag'
            X-Knotrel-Instance-Id:
              $ref: '#/components/headers/X-Knotrel-Instance-Id'
            X-Knotrel-Graph-Id:
              $ref: '#/components/headers/X-Knotrel-Graph-Id'
            X-Knotrel-Generation:
              $ref: '#/components/headers/X-Knotrel-Generation'
            X-Knotrel-State-Version:
              $ref: '#/components/headers/X-Knotrel-State-Version'
            X-Knotrel-Source-Position:
              $ref: '#/components/headers/X-Knotrel-Source-Position'
            X-Knotrel-Sync-Status:
              $ref: '#/components/headers/X-Knotrel-Sync-Status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
              example:
                nodes:
                  - node: "2"
                    active: true
                    degree: 2
                  - node: "18446744073709551615"
                    active: false
                    degree: 1
                next_after: "18446744073709551615"
        '409':
          $ref: '#/components/responses/InspectionConflict'
        '422':
          $ref: '#/components/responses/InspectionInvalid'
        '503':
          $ref: '#/components/responses/InspectionUnavailable'

  /v1/nodes/{node}:
    get:
      x-knotrel-stability: experimental
      operationId: get_node
      summary: Inspect one node
      tags:
        - Inspection
      description: |
        Read-only inspection route (`KNOTREL_INSPECTION=true`). Returns the node's flag and
        registered degree. `degree` is `null` for engines without per-node adjacency (`ett`,
        `hdt`). Accepts no query parameters.
      parameters:
        - $ref: '#/components/parameters/InspectionNode'
      responses:
        '200':
          description: The registered node
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              $ref: '#/components/headers/ETag'
            X-Knotrel-Instance-Id:
              $ref: '#/components/headers/X-Knotrel-Instance-Id'
            X-Knotrel-Graph-Id:
              $ref: '#/components/headers/X-Knotrel-Graph-Id'
            X-Knotrel-Generation:
              $ref: '#/components/headers/X-Knotrel-Generation'
            X-Knotrel-State-Version:
              $ref: '#/components/headers/X-Knotrel-State-Version'
            X-Knotrel-Source-Position:
              $ref: '#/components/headers/X-Knotrel-Source-Position'
            X-Knotrel-Sync-Status:
              $ref: '#/components/headers/X-Knotrel-Sync-Status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectedNode'
        '404':
          $ref: '#/components/responses/InspectionUnknownNode'
        '409':
          $ref: '#/components/responses/InspectionConflict'
        '422':
          $ref: '#/components/responses/InspectionInvalid'
        '503':
          $ref: '#/components/responses/InspectionUnavailable'

  /v1/nodes/{node}/edges:
    get:
      x-knotrel-stability: experimental
      operationId: list_node_edges
      summary: List one node's incident edges (inspection)
      tags:
        - Inspection
      description: |
        Read-only inspection route (`KNOTREL_INSPECTION=true`); requires `compact-bfs`
        (otherwise 409 `inspection_unsupported`). Order: ascending neighbor ID with lifecycle
        support, neighbor registration order without it. `after` is the last neighbor
        returned. With lifecycle support it need not be registered. Without it, it must name a
        registered node (nodes are never removed in that mode), otherwise 422
        `invalid_cursor`. Each page examines at most 10000 incidences. Same consistency
        rules as `GET /v1/nodes`.
      parameters:
        - $ref: '#/components/parameters/InspectionNode'
        - $ref: '#/components/parameters/InspectionAfter'
        - $ref: '#/components/parameters/InspectionLimit'
        - $ref: '#/components/parameters/InspectionEdgeState'
      responses:
        '200':
          description: One page of incident edges
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              $ref: '#/components/headers/ETag'
            X-Knotrel-Instance-Id:
              $ref: '#/components/headers/X-Knotrel-Instance-Id'
            X-Knotrel-Graph-Id:
              $ref: '#/components/headers/X-Knotrel-Graph-Id'
            X-Knotrel-Generation:
              $ref: '#/components/headers/X-Knotrel-Generation'
            X-Knotrel-State-Version:
              $ref: '#/components/headers/X-Knotrel-State-Version'
            X-Knotrel-Source-Position:
              $ref: '#/components/headers/X-Knotrel-Source-Position'
            X-Knotrel-Sync-Status:
              $ref: '#/components/headers/X-Knotrel-Sync-Status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEdgePage'
        '404':
          $ref: '#/components/responses/InspectionUnknownNode'
        '409':
          $ref: '#/components/responses/InspectionConflict'
        '422':
          $ref: '#/components/responses/InspectionInvalid'
        '503':
          $ref: '#/components/responses/InspectionUnavailable'

  /v1/edges:
    get:
      x-knotrel-stability: experimental
      operationId: list_edges
      summary: List edges once each (inspection)
      tags:
        - Inspection
      description: |
        Read-only inspection route (`KNOTREL_INSPECTION=true`); requires `compact-bfs`.
        Each edge appears once as `source < target`, ordered by `source` ascending and then by
        `source`'s incidence order. Resume with `after_source` and, when present,
        `after_target` from `next_after_source` / `next_after_target`. A page examines at most
        10000 nodes plus incidences. Same consistency rules as `GET /v1/nodes`.
      parameters:
        - name: after_source
          in: query
          required: false
          description: Resume position (`next_after_source` of the previous page).
          schema:
            $ref: '#/components/schemas/NodeId'
        - name: after_target
          in: query
          required: false
          description: Resume position inside `after_source` (`next_after_target`); requires `after_source`.
          schema:
            $ref: '#/components/schemas/NodeId'
        - $ref: '#/components/parameters/InspectionLimit'
        - $ref: '#/components/parameters/InspectionEdgeState'
      responses:
        '200':
          description: One page of edges
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              $ref: '#/components/headers/ETag'
            X-Knotrel-Instance-Id:
              $ref: '#/components/headers/X-Knotrel-Instance-Id'
            X-Knotrel-Graph-Id:
              $ref: '#/components/headers/X-Knotrel-Graph-Id'
            X-Knotrel-Generation:
              $ref: '#/components/headers/X-Knotrel-Generation'
            X-Knotrel-State-Version:
              $ref: '#/components/headers/X-Knotrel-State-Version'
            X-Knotrel-Source-Position:
              $ref: '#/components/headers/X-Knotrel-Source-Position'
            X-Knotrel-Sync-Status:
              $ref: '#/components/headers/X-Knotrel-Sync-Status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePage'
        '409':
          $ref: '#/components/responses/InspectionConflict'
        '422':
          $ref: '#/components/responses/InspectionInvalid'
        '503':
          $ref: '#/components/responses/InspectionUnavailable'

components:
  parameters:
    InspectionNode:
      name: node
      in: path
      required: true
      description: Node ID (ASCII decimal digits, u64; leading zeroes are normalized).
      schema:
        $ref: '#/components/schemas/NodeId'
    InspectionAfter:
      name: after
      in: query
      required: false
      description: Exclusive cursor, the last node (or neighbor) of the previous page. Never expires.
      schema:
        $ref: '#/components/schemas/NodeId'
    InspectionLimit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    InspectionEdgeState:
      name: state
      in: query
      required: false
      description: Edge filter. Without lifecycle support every edge is enabled and effective.
      schema:
        type: string
        enum: [all, enabled, disabled, effective, ineffective]
        default: all
  responses:
    InspectionConflict:
      description: |
        `inspection_disabled` (KNOTREL_INSPECTION is not enabled; rejected before admission)
        or `inspection_unsupported` (incident and edge listing on `ett` or `hdt`).
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOutcome'
    InspectionInvalid:
      description: |
        `invalid_request`: unknown, repeated or malformed query parameter, invalid node ID,
        `limit` outside 1-1000, unknown `state`, `after_target` without `after_source`.
        `invalid_cursor`: a plain `compact-bfs` incidence cursor names an unregistered node.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOutcome'
    InspectionUnknownNode:
      description: The inspected node is not registered (`unknown_node`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOutcome'
    InspectionUnavailable:
      description: Admission exhausted (`busy`), worker unavailable, draining or `request_timeout`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOutcome'
  headers:
    ETag:
      description: |
        Replacement token `"<generation>.<state_version>.<encoded source position>"`.
        The position segment is empty when no source position exists (standalone mode).
      schema:
        type: string
      example: '"1.0.pos-1"'
    X-Knotrel-Instance-Id:
      description: Identifier of the serving process instance.
      schema:
        type: string
    X-Knotrel-Graph-Id:
      description: Graph identifier; always `default`.
      schema:
        type: string
        const: default
    X-Knotrel-Generation:
      description: Published graph generation; `0` in standalone mode.
      schema:
        type: string
        pattern: '^[0-9]+$'
    X-Knotrel-State-Version:
      description: |
        Instance-local revision as an arbitrary-precision decimal string. It advances
        once per effective mutation (`changed: true`).
      schema:
        type: string
        pattern: '^[0-9]+$'
    X-Knotrel-Source-Position:
      description: Percent-encoded applied source position. Present only when one exists.
      schema:
        type: string
    X-Knotrel-Sync-Status:
      description: Synchronization status. Present only in source-managed mode.
      schema:
        type: string
        enum: [uninitialized, loading, catching_up, ready, stale, desynchronized]
  schemas:
    NodeId:
      type: string
      pattern: '^[0-9]+$'
      description: |
        Nonempty string of ASCII decimal digits representing an unsigned 64-bit integer
        (0 through 18446744073709551615). Leading zeroes are accepted and normalized.
      example: "42"

    AddNodeOperation:
      type: object
      required:
        - op
        - node
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [add_node]
        node:
          $ref: '#/components/schemas/NodeId'

    LinkOperation:
      type: object
      required:
        - op
        - source
        - target
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [link]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'

    CutOperation:
      type: object
      required:
        - op
        - source
        - target
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [cut]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'

    ConnectedOperation:
      type: object
      required:
        - op
        - source
        - target
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [connected]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'

    SetNodeActiveOperation:
      type: object
      description: Lifecycle support only. Sets the node's `active` flag.
      required:
        - op
        - node
        - active
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [set_node_active]
        node:
          $ref: '#/components/schemas/NodeId'
        active:
          type: boolean

    SetEdgeEnabledOperation:
      type: object
      description: Lifecycle support only. Sets the registered edge's `enabled` flag.
      required:
        - op
        - source
        - target
        - enabled
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [set_edge_enabled]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'
        enabled:
          type: boolean

    RemoveNodeOperation:
      type: object
      description: Lifecycle support only. Removes the node and every incident registered edge.
      required:
        - op
        - node
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [remove_node]
        node:
          $ref: '#/components/schemas/NodeId'

    NodeStateOperation:
      type: object
      description: Lifecycle support only. Query; an absent node is not an error.
      required:
        - op
        - node
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [node_state]
        node:
          $ref: '#/components/schemas/NodeId'

    EdgeStateOperation:
      type: object
      description: |
        Lifecycle support only. Query; an absent edge is not an error. `source == target`
        returns `self_loop`.
      required:
        - op
        - source
        - target
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [edge_state]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'

    Operation:
      oneOf:
        - $ref: '#/components/schemas/AddNodeOperation'
        - $ref: '#/components/schemas/LinkOperation'
        - $ref: '#/components/schemas/CutOperation'
        - $ref: '#/components/schemas/ConnectedOperation'
        - $ref: '#/components/schemas/SetNodeActiveOperation'
        - $ref: '#/components/schemas/SetEdgeEnabledOperation'
        - $ref: '#/components/schemas/RemoveNodeOperation'
        - $ref: '#/components/schemas/NodeStateOperation'
        - $ref: '#/components/schemas/EdgeStateOperation'
      discriminator:
        propertyName: op
        mapping:
          add_node: '#/components/schemas/AddNodeOperation'
          link: '#/components/schemas/LinkOperation'
          cut: '#/components/schemas/CutOperation'
          connected: '#/components/schemas/ConnectedOperation'
          set_node_active: '#/components/schemas/SetNodeActiveOperation'
          set_edge_enabled: '#/components/schemas/SetEdgeEnabledOperation'
          remove_node: '#/components/schemas/RemoveNodeOperation'
          node_state: '#/components/schemas/NodeStateOperation'
          edge_state: '#/components/schemas/EdgeStateOperation'

    ChangedOutcome:
      type: object
      required:
        - result
        - changed
      properties:
        result:
          type: string
          enum: [changed]
        changed:
          type: boolean
          description: True if graph connectivity structure changed; false for no-ops.

    ConnectedOutcome:
      type: object
      required:
        - result
        - connected
      properties:
        result:
          type: string
          enum: [connected]
        connected:
          type: boolean
          description: True if both vertices belong to the same connected component.

    NodeStateOutcome:
      type: object
      description: |
        Result of `node_state`. An absent node reports `registered: false` and
        `active: false`.
      required:
        - result
        - registered
        - active
      properties:
        result:
          type: string
          enum: [node_state]
        registered:
          type: boolean
        active:
          type: boolean

    EdgeStateOutcome:
      type: object
      description: |
        Result of `edge_state`. `effective` means enabled with both endpoints active. An
        absent edge reports `registered: false` and `false` flags.
      required:
        - result
        - registered
        - enabled
        - effective
      properties:
        result:
          type: string
          enum: [edge_state]
        registered:
          type: boolean
        enabled:
          type: boolean
        effective:
          type: boolean

    ErrorCode:
      type: string
      description: |
        Machine-readable error code. Clients should branch on it, not on the message, and handle an
        unknown code as an error of its status class.

        `too_many_connections` is not produced by any operation: the accept loop writes a static
        `503` with this code to a connection opened beyond `KNOTREL_MAX_CONNECTIONS`, before any
        request is read, and closes it (best effort; a client may instead see a reset).
        `busy` is the code of every exhausted admission lane (shared, feeder data, feeder control);
        `import_in_progress` only means that another import holds the import permit.
      enum:
        - barrier_not_reached
        - barrier_position_mismatch
        - busy
        - conflicting_duplicate
        - desynchronized
        - direct_mutation_disabled
        - edge_limit_exceeded
        - event_failed
        - fenced_feeder_session
        - generation_exhausted
        - graph_already_initialized
        - graph_desynchronized
        - graph_uninitialized
        - import_in_progress
        - inspection_disabled
        - inspection_unsupported
        - invalid_batch_size
        - invalid_cursor
        - invalid_edge
        - invalid_graph_id
        - invalid_instance_id
        - invalid_lease_duration
        - invalid_node
        - invalid_request
        - lease_expired
        - loading
        - mode_conflict
        - node_limit_exceeded
        - out_of_order_sequence
        - payload_too_large
        - precondition_failed
        - request_timeout
        - self_loop
        - sequence_exhausted
        - session_required
        - shutting_down
        - source_epoch_mismatch
        - source_mismatch
        - source_predecessor_mismatch
        - stale_generation
        - stale_instance_id
        - superseded_barrier
        - too_many_connections
        - topology_lifecycle_disabled
        - unavailable
        - uninitialized
        - unknown_edge
        - unknown_node
        - unverifiable_duplicate

    ErrorOutcome:
      type: object
      required:
        - result
        - code
        - message
      properties:
        expected_sequence:
          $ref: '#/components/schemas/FeederU64'
        result:
          type: string
          enum: [error]
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable error description.
          example: "unknown node: 3"

    Outcome:
      oneOf:
        - $ref: '#/components/schemas/ChangedOutcome'
        - $ref: '#/components/schemas/ConnectedOutcome'
        - $ref: '#/components/schemas/NodeStateOutcome'
        - $ref: '#/components/schemas/EdgeStateOutcome'
        - $ref: '#/components/schemas/ErrorOutcome'
      discriminator:
        propertyName: result
        mapping:
          changed: '#/components/schemas/ChangedOutcome'
          connected: '#/components/schemas/ConnectedOutcome'
          node_state: '#/components/schemas/NodeStateOutcome'
          edge_state: '#/components/schemas/EdgeStateOutcome'
          error: '#/components/schemas/ErrorOutcome'

    BatchRequest:
      type: object
      required:
        - operations
      additionalProperties: false
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/Operation'

    BatchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Outcome'

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]

    ReadinessReadyResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ready]

    ReadinessNotReadyResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [starting, draining, unavailable, uninitialized, loading, catching_up, stale, desynchronized]
          description: |
            `starting`, `draining` and `unavailable` occur in both modes. The other values are
            reported only in source-managed mode.

    ServerInfo:
      type: object
      required:
        - engine
        - experimental
        - max_pending_jobs
        - max_body_bytes
        - max_batch_operations
        - max_nodes
        - max_edges
      properties:
        engine:
          type: string
          enum: [compact-bfs, ett, hdt]
          description: Configured connectivity engine.
        experimental:
          type: boolean
          description: Whether the engine is experimental.
        max_pending_jobs:
          type: integer
          description: Maximum queued plus running graph operations on the shared admission lane.
        feeder_reserved_jobs:
          type: integer
          minimum: 1
          maximum: 64
          description: |
            Present only in source-managed mode. Admission permits reserved for feeder events,
            barriers and gap declarations (`KNOTREL_FEEDER_RESERVED_JOBS`, default 4); queries never
            use them. Feeder sessions and heartbeats have two further permits of their own.
        max_body_bytes:
          type: integer
          description: Maximum allowed request body size in bytes.
        max_batch_operations:
          type: integer
          description: Maximum operations in a single batch request.
        max_nodes:
          type: [integer, "null"]
          description: Maximum node capacity bound, or null if unlimited.
        max_edges:
          type: [integer, "null"]
          description: Maximum edge capacity bound, or null if unlimited.
        topology_lifecycle:
          type: boolean
          const: true
          description: |
            Present, and `true`, only when node and edge lifecycle support is enabled
            (`KNOTREL_TOPOLOGY_LIFECYCLE=true`); absent otherwise.
        mode:
          type: string
          const: source_managed
          description: |
            Present only in source-managed mode (`KNOTREL_MODE=source_managed`). Absent in
            standalone mode. The response carries no server software version.
        inspection:
          type: boolean
          const: true
          description: |
            Present, and `true`, only when the read-only inspection routes are enabled
            (`KNOTREL_INSPECTION=true`); absent otherwise.
        instance_id:
          type: string
          description: |
            Present only in source-managed mode: the current process instance ID that feeder
            requests must carry. In both modes the same value is returned in the
            `X-Knotrel-Instance-Id` header of `/v1/stats`, `/v1/operations` and `/v1/batch`.

    GraphSnapshot:
      type: object
      required:
        - node_count
        - edge_count
        - max_nodes
        - max_edges
        - remaining_nodes
        - remaining_edges
        - state_version
      properties:
        node_count:
          type: integer
          minimum: 0
          description: Current count of registered vertices, active or inactive.
        edge_count:
          type: integer
          minimum: 0
          description: Current count of registered undirected edges, enabled or disabled.
        active_node_count:
          $ref: '#/components/schemas/ActiveNodeCount'
        enabled_edge_count:
          $ref: '#/components/schemas/EnabledEdgeCount'
        effective_edge_count:
          $ref: '#/components/schemas/EffectiveEdgeCount'
        max_nodes:
          type: [integer, "null"]
          description: Configured node limit ceiling, or null if unlimited.
        max_edges:
          type: [integer, "null"]
          description: Configured edge limit ceiling, or null if unlimited.
        remaining_nodes:
          type: [integer, "null"]
          description: Remaining vertex capacity before reaching limit, or null if unlimited.
        remaining_edges:
          type: [integer, "null"]
          description: Remaining edge capacity before reaching limit, or null if unlimited.
        state_version:
          type: string
          pattern: '^[0-9]+$'
          description: Decimal string monotonic version counter incremented on effective mutations.
        instance_id:
          type: string
          description: Source-managed mode only. Current process instance ID.
        generation:
          $ref: '#/components/schemas/FeederU64'
          description: |
            Source-managed mode only. Published generation as a JSON integer that can exceed
            2^53; clients must parse it losslessly. The `X-Knotrel-Generation` header carries
            the same value as a decimal string in both modes.
        source_position:
          type: string
          description: |
            Source-managed mode only, and only once a source position exists. Raw (not
            percent-encoded) applied source position.
        sync_status:
          $ref: '#/components/schemas/FeederSyncStatus'

    ActiveNodeCount:
      type: integer
      minimum: 0
      description: Lifecycle support only. Registered nodes whose flag is active.

    EnabledEdgeCount:
      type: integer
      minimum: 0
      description: Lifecycle support only. Registered edges whose flag is enabled, effective or not.

    EffectiveEdgeCount:
      type: integer
      minimum: 0
      description: Lifecycle support only. Edges that are enabled and whose endpoints are both active.

    # Inspection payloads (GET /v1/nodes, /v1/nodes/{node}, /v1/nodes/{node}/edges, /v1/edges).

    InspectedNode:
      type: object
      required: [node, active, degree]
      properties:
        node:
          $ref: '#/components/schemas/NodeId'
        active:
          type: boolean
          description: The node's flag; always `true` without lifecycle support.
        degree:
          type: [integer, "null"]
          minimum: 0
          description: Registered incident edges (enabled or not); `null` for `ett` and `hdt`.

    NodePage:
      type: object
      required: [nodes, next_after]
      properties:
        nodes:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/InspectedNode'
        next_after:
          description: Cursor of the next page (`after`); `null` when the traversal is complete.
          oneOf:
            - $ref: '#/components/schemas/NodeId'
            - type: "null"

    IncidentEdge:
      type: object
      required: [neighbor, enabled, effective]
      properties:
        neighbor:
          $ref: '#/components/schemas/NodeId'
        enabled:
          type: boolean
          description: The edge's own flag (desired state).
        effective:
          type: boolean
          description: Enabled with both endpoints active; participates in connectivity.

    IncidentEdgePage:
      type: object
      required: [node, edges, next_after]
      properties:
        node:
          $ref: '#/components/schemas/InspectedNode'
        edges:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/IncidentEdge'
        next_after:
          description: Last neighbor examined, the cursor of the next page; `null` when complete.
          oneOf:
            - $ref: '#/components/schemas/NodeId'
            - type: "null"

    InspectedEdge:
      type: object
      required: [source, target, enabled, effective]
      properties:
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'
        enabled:
          type: boolean
        effective:
          type: boolean

    EdgePage:
      type: object
      required: [edges, next_after_source, next_after_target]
      properties:
        edges:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/InspectedEdge'
        next_after_source:
          description: Resume position (`after_source`); `null` when the traversal is complete.
          oneOf:
            - $ref: '#/components/schemas/NodeId'
            - type: "null"
        next_after_target:
          description: Resume position inside `next_after_source` (`after_target`), or `null`.
          oneOf:
            - $ref: '#/components/schemas/NodeId'
            - type: "null"

    # Feeder payloads; operational recovery details are in integration-contract.md.

    ImportNode:
      description: |
        One `nodes` entry of `POST /v1/feeder/import`: a node ID string (active), or an
        object with both members required. The object form requires lifecycle support even
        when `active` is `true`; otherwise the import is rejected with 409
        `topology_lifecycle_disabled`.
      oneOf:
        - $ref: '#/components/schemas/NodeId'
        - type: object
          required:
            - node
            - active
          additionalProperties: false
          properties:
            node:
              $ref: '#/components/schemas/NodeId'
            active:
              type: boolean

    ImportEdge:
      type: object
      description: |
        One `edges` entry of `POST /v1/feeder/import`. Missing endpoints are registered
        active. `enabled` (default `true`) requires lifecycle support even when `true`.
      required:
        - source
        - target
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'
        enabled:
          type: boolean
          default: true

    ImportRequest:
      type: object
      description: |
        Body of `POST /v1/feeder/import`. It must carry the complete registered topology,
        including isolated and inactive nodes and disabled edges. Repeated entries must
        agree; a conflicting flag is 422 `invalid_node` or `invalid_edge`.
      required:
        - mode
        - instance_id
        - graph_id
        - source_id
        - source_epoch
        - source_position
        - feeder_session_id
        - feeder_epoch
        - nodes
        - edges
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [create_only, replace]
        instance_id:
          type: string
        graph_id:
          type: string
          const: default
        source_id:
          type: string
        source_epoch:
          type: string
        source_position:
          type: string
          minLength: 1
          maxLength: 256
          description: Opaque source cursor of the imported snapshot, 1 to 256 bytes of UTF-8. The limit counts UTF-8 bytes, which the server enforces; `minLength`/`maxLength` count characters, so a multibyte string can be refused (422 `invalid_request`) below the character limit.
        feeder_session_id:
          type: string
        feeder_epoch:
          type: integer
          minimum: 0
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ImportNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ImportEdge'

    ImportResponse:
      type: object
      description: Successful import publication (`201 Created`).
      required:
        - result
        - instance_id
        - graph_id
        - generation
        - state_version
        - node_count
        - edge_count
        - source_position
        - status
      properties:
        result:
          type: string
          enum: [published]
        instance_id:
          type: string
        graph_id:
          type: string
          const: default
        generation:
          type: integer
          minimum: 1
        state_version:
          type: string
          pattern: '^[0-9]+$'
        node_count:
          type: integer
          minimum: 0
          description: Registered nodes.
        edge_count:
          type: integer
          minimum: 0
          description: Registered edges.
        active_node_count:
          $ref: '#/components/schemas/ActiveNodeCount'
        enabled_edge_count:
          $ref: '#/components/schemas/EnabledEdgeCount'
        effective_edge_count:
          $ref: '#/components/schemas/EffectiveEdgeCount'
        source_position:
          type: string
        status:
          type: string
          enum: [uninitialized, loading, catching_up, ready, stale, desynchronized]

    FeederEvent:
      type: object
      description: |
        One event of `POST /v1/feeder/events`. Required and forbidden operands by `op`:
        `add_node` needs `node`; `link` and `cut` need `source` and `target`; `progress`
        has no operand; `set_node_active` needs `node` and `active`; `set_edge_enabled`
        needs `source`, `target` and `enabled`; `remove_node` needs `node`. Any other
        operand is forbidden (422 `invalid_request`), so `active` and `enabled` are
        rejected on `add_node`, `link`, `cut` and `progress` whatever the setting. The three
        lifecycle operations require lifecycle support; otherwise the whole request is
        rejected with 409 `topology_lifecycle_disabled`.
      required:
        - event_id
        - delivery_sequence
        - prev_delivery_sequence
        - source_position
        - prev_source_position
        - op
      additionalProperties: false
      properties:
        event_id:
          type: string
          maxLength: 64
          description: At most 64 bytes of UTF-8 (no minimum). The limit counts UTF-8 bytes, which the server enforces; `minLength`/`maxLength` count characters, so a multibyte string can be refused (422 `invalid_request`) below the character limit.
        delivery_sequence:
          type: integer
          minimum: 0
        prev_delivery_sequence:
          type: integer
          minimum: 0
        source_position:
          type: string
          minLength: 1
          maxLength: 256
          description: 1 to 256 bytes of UTF-8. The limit counts UTF-8 bytes, which the server enforces; `minLength`/`maxLength` count characters, so a multibyte string can be refused (422 `invalid_request`) below the character limit.
        prev_source_position:
          type: string
          minLength: 1
          maxLength: 256
          description: 1 to 256 bytes of UTF-8. The limit counts UTF-8 bytes, which the server enforces; `minLength`/`maxLength` count characters, so a multibyte string can be refused (422 `invalid_request`) below the character limit.
        op:
          type: string
          enum: [add_node, link, cut, progress, set_node_active, set_edge_enabled, remove_node]
        node:
          $ref: '#/components/schemas/NodeId'
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'
        active:
          type: boolean
          description: Required on `set_node_active`; forbidden on every other operation.
        enabled:
          type: boolean
          description: Required on `set_edge_enabled`; forbidden on every other operation.

    FeederU64:
      type: integer
      minimum: 0
      maximum: 18446744073709551615
    FeederSyncStatus:
      type: string
      enum:
      - uninitialized
      - loading
      - catching_up
      - ready
      - stale
      - desynchronized
    SessionRequest:
      type: object
      required:
      - instance_id
      - feeder_session_id
      - feeder_epoch
      - lease_duration_ms
      properties:
        instance_id:
          type: string
        feeder_session_id:
          type: string
        feeder_epoch:
          $ref: '#/components/schemas/FeederU64'
        lease_duration_ms:
          type: integer
          minimum: 1000
          maximum: 60000
      additionalProperties: false
    HeartbeatRequest:
      type: object
      required:
      - instance_id
      - feeder_session_id
      - feeder_epoch
      properties:
        instance_id:
          type: string
        feeder_session_id:
          type: string
        feeder_epoch:
          $ref: '#/components/schemas/FeederU64'
      additionalProperties: false
    SessionResponse:
      type: object
      required:
      - result
      - instance_id
      - feeder_session_id
      - feeder_epoch
      - lease_duration_ms
      - generation
      - applied_delivery_sequence
      - applied_source_position
      - status
      properties:
        result:
          type: string
          enum:
          - session_acquired
        instance_id:
          type: string
        feeder_session_id:
          type: string
        feeder_epoch:
          $ref: '#/components/schemas/FeederU64'
        lease_duration_ms:
          $ref: '#/components/schemas/FeederU64'
        generation:
          $ref: '#/components/schemas/FeederU64'
        applied_delivery_sequence:
          $ref: '#/components/schemas/FeederU64'
        applied_source_position:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/FeederSyncStatus'
    HeartbeatResponse:
      type: object
      required:
      - result
      - instance_id
      - feeder_session_id
      - feeder_epoch
      - lease_expires_in_ms
      - status
      properties:
        result:
          type: string
          enum:
          - heartbeat_acknowledged
        instance_id:
          type: string
        feeder_session_id:
          type: string
        feeder_epoch:
          $ref: '#/components/schemas/FeederU64'
        lease_expires_in_ms:
          $ref: '#/components/schemas/FeederU64'
        status:
          $ref: '#/components/schemas/FeederSyncStatus'
    FeederEventsRequest:
      type: object
      required:
      - instance_id
      - feeder_session_id
      - feeder_epoch
      - graph_id
      - generation
      - source_id
      - source_epoch
      - events
      properties:
        instance_id:
          type: string
        feeder_session_id:
          type: string
        feeder_epoch:
          $ref: '#/components/schemas/FeederU64'
        graph_id:
          type: string
          const: default
        generation:
          $ref: '#/components/schemas/FeederU64'
