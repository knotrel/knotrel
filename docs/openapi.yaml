  /v1/feeder/events:
    post:
      operationId: feeder_events
      summary: Apply ordered source events
      tags:
      - Feeder
      description: "Accepts 1\u20131024 events, with source continuity, generation/session fencing and bounded duplicate\
        \ verification. Multi-event execution stops at the first error and preserves the applied prefix; no rollback.\
        \ The source position never advances ahead of applied events. Exact single-event retries can return duplicate;\
        \ retained matching duplicates in batches are skipped and events_applied counts only newly applied events.\
        \ Whole-request validation failures apply no events. Timeouts can leave the applied prefix uncertain. This\
        \ differs from the legacy /v1/batch continue-on-error contract. Available only in source_managed mode. Both\
        \ the header and body instance_id must match the serving process. This is fencing, not authentication. Except\
        \ for import, request bodies have a fixed 1 MiB limit. See http-api.md and integration-contract.md for validation\
        \ order and recovery semantics."
