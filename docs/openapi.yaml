openapi: 3.1.0
info:
  title: Knotrel HTTP API
  version: 0.9.0
  description: |
    REST API for Knotrel, an in-memory dynamic graph connectivity service.

    Knotrel maintains an undirected simple graph in memory and answers dynamic connectivity
    queries across incremental edge/vertex insertions and deletions.

    For full operational semantics, trust model, and lifecycle details, see
    [http-api.md](http-api.md).
servers:
  - url: http://127.0.0.1:8080
    description: Default local server address

paths:
  /health:
    get:
      summary: Liveness probe
      description: |
        Process liveness probe. Returns HTTP 200 while the server process is functional.
        Never acquires the graph lock and stays 200 during graceful shutdown draining.
      tags:
        - Lifecycle
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok

  /ready:
    get:
      summary: Readiness probe
      description: |
        Reports whether the server is initialized and accepting graph operations.
        Does not acquire the graph lock or an admission permit. Always returns
        `Cache-Control: no-store`.
      tags:
        - Lifecycle
      responses:
        '200':
          description: Server is initialized and accepting graph work
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReadyResponse'
              example:
                status: ready
        '503':
          description: |
            Server is not ready: starting up, draining for shutdown or graph worker failed
            (both modes); in source-managed mode also uninitialized, loading, catching up,
            stale (expired feeder lease) or desynchronized.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessNotReadyResponse'
              examples:
                starting:
                  summary: Starting up
                  value:
                    status: starting
                draining:
                  summary: Graceful shutdown in progress
                  value:
                    status: draining
                unavailable:
                  summary: Graph worker failed or panicked
                  value:
                    status: unavailable
                catching_up:
                  summary: Source-managed mode, published image not yet verified by a barrier
                  value:
                    status: catching_up

  /metrics:
    get:
      summary: Prometheus metrics (opt-in)
      description: |
        Present only when the server is started with `KNOTREL_METRICS_ENABLED=true`;
        otherwise the route is not registered and returns 404. Unauthenticated, like
        every other route. Prometheus text format 0.0.4. Takes no graph lock and no
        admission or import permit. While draining it is still served, with
        `Connection: close`. See observability-contract.md for metric semantics.
      tags:
        - Lifecycle
      responses:
        '200':
          description: Current metrics
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
        '404':
          description: Metrics are disabled

  /v1/info:
    get:
      summary: Server configuration and metadata
      description: |
        Returns effective immutable configuration settings and engine selection.
        Does not acquire the graph lock or an admission permit.
      tags:
        - Metadata
      responses:
        '200':
          description: Effective server configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
              example:
                engine: compact-bfs
                experimental: false
                max_pending_jobs: 32
                max_body_bytes: 1048576
                max_batch_operations: 1024
                max_nodes: 100000
                max_edges: 500000

  /v1/stats:
    get:
      summary: Live graph state snapshot
      description: |
        Returns a coherent snapshot of the live graph's node and edge counts,
        configured capacity bounds, remaining capacity, and state revision.
        Acquires the graph lock on a blocking worker and shares the bounded admission queue.
        Always returns `Cache-Control: no-store`.
      tags:
        - Metadata
      responses:
        '200':
          description: Coherent graph snapshot; version headers are captured under the same lock
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            ETag:
              $ref: '#/components/headers/ETag'
            X-Knotrel-Instance-Id:
              $ref: '#/components/headers/X-Knotrel-Instance-Id'
            X-Knotrel-Graph-Id:
              $ref: '#/components/headers/X-Knotrel-Graph-Id'
            X-Knotrel-Generation:
              $ref: '#/components/headers/X-Knotrel-Generation'
            X-Knotrel-State-Version:
              $ref: '#/components/headers/X-Knotrel-State-Version'
            X-Knotrel-Source-Position:
              $ref: '#/components/headers/X-Knotrel-Source-Position'
            X-Knotrel-Sync-Status:
              $ref: '#/components/headers/X-Knotrel-Sync-Status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSnapshot'
              example:
                node_count: 42000
                edge_count: 68000
                max_nodes: 100000
                max_edges: 500000
                remaining_nodes: 58000
                remaining_edges: 432000
                state_version: "157"
        '503':
          description: Request capacity exhausted (`busy`) or graph worker unavailable (`unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                busy:
                  summary: Queue saturated
                  value:
                    result: error
                    code: busy
                    message: "request capacity exhausted; retry later"
                unavailable:
                  summary: Worker unavailable
                  value:
                    result: error
                    code: unavailable
                    message: "graph worker unavailable"

  /v1/operations:
    post:
      summary: Execute a single graph operation
      description: |
        Executes a single graph mutation (`add_node`, `link`, `cut`) or query (`connected`)
        under exclusive graph lock. Request body must be valid JSON within 1 MiB.
        With `KNOTREL_TOPOLOGY_LIFECYCLE=true`, the lifecycle mutations `set_node_active`,
        `set_edge_enabled` and `remove_node` and the queries `node_state` and `edge_state`
        are also executed; without it they always parse but are rejected with 409
        `topology_lifecycle_disabled` before execution.
      tags:
        - Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Operation'
            examples:
              add_node:
                summary: Add isolated vertex
                value:
                  op: add_node
                  node: "1"
              link:
                summary: Insert undirected edge
                value:
                  op: link
                  source: "1"
                  target: "2"
              cut:
                summary: Remove undirected edge
                value:
                  op: cut
                  source: "1"
                  target: "2"
              connected:
                summary: Query connectivity
                value:
                  op: connected
                  source: "1"
                  target: "2"
              set_node_active:
                summary: Set a node flag (lifecycle support only)
                value:
                  op: set_node_active
                  node: "2"
                  active: false
              set_edge_enabled:
                summary: Set an edge flag (lifecycle support only)
                value:
                  op: set_edge_enabled
                  source: "1"
                  target: "2"
                  enabled: false
              remove_node:
                summary: Remove a node and its incident edges (lifecycle support only)
                value:
                  op: remove_node
                  node: "2"
              node_state:
                summary: Query a node's registration and flag (lifecycle support only)
                value:
                  op: node_state
                  node: "2"
              edge_state:
                summary: Query an edge's registration and flags (lifecycle support only)
                value:
                  op: edge_state
                  source: "1"
                  target: "2"
      responses:
        '200':
          description: |
            Operation completed successfully. Version headers are captured under the same lock
            acquisition as the outcome. Error responses carry no version headers.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Knotrel-Instance-Id:
              $ref: '#/components/headers/X-Knotrel-Instance-Id'
            X-Knotrel-Graph-Id:
              $ref: '#/components/headers/X-Knotrel-Graph-Id'
            X-Knotrel-Generation:
              $ref: '#/components/headers/X-Knotrel-Generation'
            X-Knotrel-State-Version:
              $ref: '#/components/headers/X-Knotrel-State-Version'
            X-Knotrel-Source-Position:
              $ref: '#/components/headers/X-Knotrel-Source-Position'
            X-Knotrel-Sync-Status:
              $ref: '#/components/headers/X-Knotrel-Sync-Status'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChangedOutcome'
                  - $ref: '#/components/schemas/ConnectedOutcome'
                  - $ref: '#/components/schemas/NodeStateOutcome'
                  - $ref: '#/components/schemas/EdgeStateOutcome'
              examples:
                mutation_changed:
                  summary: Mutation applied (topology changed)
                  value:
                    result: changed
                    changed: true
                mutation_noop:
                  summary: Mutation applied as no-op (no change)
                  value:
                    result: changed
                    changed: false
                query_connected:
                  summary: Vertices are connected
                  value:
                    result: connected
                    connected: true
                query_disconnected:
                  summary: Vertices are disconnected
                  value:
                    result: connected
                    connected: false
                node_state:
                  summary: Registered inactive node
                  value:
                    result: node_state
                    registered: true
                    active: false
                edge_state:
                  summary: Registered enabled edge that is not effective
                  value:
                    result: edge_state
                    registered: true
                    enabled: true
                    effective: false
        '400':
          description: Malformed JSON syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "request body is not valid JSON"
        '404':
          description: |
            Unknown query vertex, or unknown node of `set_node_active` / `set_edge_enabled`
            (`unknown_node`); unregistered edge of `set_edge_enabled` (`unknown_edge`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                unknown_node:
                  summary: Unknown vertex
                  value:
                    result: error
                    code: unknown_node
                    message: "unknown node: 3"
                unknown_edge:
                  summary: Edge not registered (lifecycle support only)
                  value:
                    result: error
                    code: unknown_edge
                    message: "unknown edge: 1-3"
        '409':
          description: |
            Mutation sent in source-managed mode (`direct_mutation_disabled`), or lifecycle
            operation while lifecycle support is off (`topology_lifecycle_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                direct_mutation_disabled:
                  summary: Source-managed mode
                  value:
                    result: error
                    code: direct_mutation_disabled
                    message: "direct graph mutations are disabled in source-managed mode; use feeder endpoints"
                topology_lifecycle_disabled:
                  summary: Lifecycle support is off
                  value:
                    result: error
                    code: topology_lifecycle_disabled
                    message: "node and edge lifecycle support is disabled; set KNOTREL_TOPOLOGY_LIFECYCLE=true (requires KNOTREL_ENGINE=compact-bfs)"
        '413':
          description: Request body exceeds 1 MiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "request body exceeded 1048576 bytes"
        '415':
          description: Missing or unsupported JSON Content-Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "Expected request with `Content-Type: application/json`"
        '422':
          description: Invalid request shape, self-loop, or capacity limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                shape:
                  summary: Missing required field or invalid format
                  value:
                    result: error
                    code: invalid_request
                    message: "missing field `op`"
                self_loop:
                  summary: Self-loop not permitted
                  value:
                    result: error
                    code: self_loop
                    message: "self-loops are not allowed"
                node_limit:
                  summary: Node capacity ceiling exceeded
                  value:
                    result: error
                    code: node_limit_exceeded
                    message: "node capacity limit exceeded"
                edge_limit:
                  summary: Edge capacity ceiling exceeded
                  value:
                    result: error
                    code: edge_limit_exceeded
                    message: "edge capacity limit exceeded"
        '503':
          description: Server busy, unavailable, shutting down, or request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                busy:
                  summary: Job queue capacity exhausted
                  value:
                    result: error
                    code: busy
                    message: "request capacity exhausted; retry later"
                unavailable:
                  summary: Graph worker failed or panicked
                  value:
                    result: error
                    code: unavailable
                    message: "graph worker unavailable"
                shutting_down:
                  summary: Server is draining
                  value:
                    result: error
                    code: shutting_down
                    message: "server is shutting down"

  /v1/batch:
    post:
      summary: Execute an ordered batch of graph operations
      description: |
        Executes between 1 and 1024 operations under a single graph lock acquisition.
        Results correspond one-to-one with the input operations.
        Batches do not provide rollback: subsequent failures do not revert earlier operations.
        Version headers on a 200 response are captured under the same lock acquisition and
        describe the state after the whole batch. Error responses carry no version headers.
        In source-managed mode, a batch containing any mutation is rejected with 409 before
        the batch size is checked. Without lifecycle support, a batch containing any
        lifecycle operation is rejected with 409 `topology_lifecycle_disabled` before the
        mode and size checks.
      tags:
        - Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            example:
              operations:
                - op: link
                  source: "1"
                  target: "2"
                - op: connected
                  source: "1"
                  target: "2"
                - op: cut
                  source: "1"
                  target: "2"
      responses:
        '200':
          description: Batch executed; per-operation outcomes returned in order
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Knotrel-Instance-Id:
              $ref: '#/components/headers/X-Knotrel-Instance-Id'
            X-Knotrel-Graph-Id:
              $ref: '#/components/headers/X-Knotrel-Graph-Id'
            X-Knotrel-Generation:
              $ref: '#/components/headers/X-Knotrel-Generation'
            X-Knotrel-State-Version:
              $ref: '#/components/headers/X-Knotrel-State-Version'
            X-Knotrel-Source-Position:
              $ref: '#/components/headers/X-Knotrel-Source-Position'
            X-Knotrel-Sync-Status:
              $ref: '#/components/headers/X-Knotrel-Sync-Status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              example:
                results:
                  - result: changed
                    changed: true
                  - result: connected
                    connected: true
                  - result: changed
                    changed: true
        '400':
          description: Malformed JSON syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "request body is not valid JSON"
        '413':
          description: Request body exceeds 1 MiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "request body exceeded 1048576 bytes"
        '415':
          description: Missing or unsupported JSON Content-Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "Expected request with `Content-Type: application/json`"
        '409':
          description: |
            Source-managed mode and the batch contains a mutation (`direct_mutation_disabled`),
            or lifecycle support is off and the batch contains a lifecycle operation
            (`topology_lifecycle_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                direct_mutation_disabled:
                  summary: Source-managed mode
                  value:
                    result: error
                    code: direct_mutation_disabled
                    message: "direct graph mutations are disabled in source-managed mode; use feeder endpoints"
                topology_lifecycle_disabled:
                  summary: Lifecycle support is off
                  value:
                    result: error
                    code: topology_lifecycle_disabled
                    message: "node and edge lifecycle support is disabled; set KNOTREL_TOPOLOGY_LIFECYCLE=true (requires KNOTREL_ENGINE=compact-bfs)"
        '422':
          description: Invalid batch size (not 1–1024) or invalid operation shape in batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                batch_size:
                  summary: Batch size outside 1–1024
                  value:
                    result: error
                    code: invalid_batch_size
                    message: "batches must contain 1 to 1024 operations"
                shape:
                  summary: Invalid field or ID format in operation
                  value:
                    result: error
                    code: invalid_request
                    message: "node IDs must be nonempty strings of ASCII decimal digits"
        '503':
          description: |
            Server busy, unavailable, shutting down, or request timed out. After
            `request_timeout`, the effect of the batch is unknown: an admitted worker
            may still apply it later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                busy:
                  summary: No graph job slot available; no operation was admitted
                  value:
                    result: error
                    code: busy
                    message: "request capacity exhausted; retry later"
                unavailable:
                  summary: Graph worker unavailable
                  value:
                    result: error
                    code: unavailable
                    message: "graph worker unavailable"
                shutting_down:
                  summary: Server is draining
                  value:
                    result: error
                    code: shutting_down
                    message: "server is shutting down; retry against another instance"
                request_timeout:
                  summary: Request time limit exceeded; effect unknown
                  value:
                    result: error
                    code: request_timeout
                    message: "request exceeded the server time limit; its effect is unknown"

  /v1/feeder/session:
    post:
      operationId: feeder_session
      summary: Acquire or supersede a feeder session
      tags:
      - Feeder
      description: "Register a monotonic feeder epoch with a lease of 1000\u201360000 ms. Session ownership does not\
        \ itself publish a graph or establish readiness. Available only in source_managed mode. Both the header and\
        \ body instance_id must match the serving process. This is fencing, not authentication. Except for import,\
        \ request bodies have a fixed 1 MiB limit. See http-api.md and integration-contract.md for validation order\
        \ and recovery semantics."
      parameters:
      - name: X-Knotrel-Instance-Id
        in: header
        required: true
        description: Current process instance ID from GET /v1/info.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: Successful feeder operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Malformed JSON, missing/invalid instance header or invalid graph ID; session also rejects an
            invalid lease duration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '409':
          description: Mode, instance, session, lease, generation or source conflict; graph state may require rebuild.
            See ErrorCode for identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '413':
          description: Request body exceeds its limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '415':
          description: Content-Type is not application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '422':
          description: Invalid payload shape, operands or domain operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '503':
          description: The feeder control lane (session and heartbeat, 2 permits) is exhausted (`busy`), the graph
            worker is unavailable (`unavailable`), the server is draining (`shutting_down`) or the request timed out
            (`request_timeout`; a dispatched worker may still complete, so the outcome is uncertain). `busy` means
            nothing of the request was applied; retry later. This route never answers `import_in_progress`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
  /v1/feeder/heartbeat:
    post:
      operationId: feeder_heartbeat
      summary: Renew the current feeder lease
      tags:
      - Feeder
      description: Renews the matching session lease. A heartbeat does not restore ready after lease expiry; recovery
        requires a new epoch and a verified barrier. Available only in source_managed mode. Both the header and body
        instance_id must match the serving process. This is fencing, not authentication. Except for import, request
        bodies have a fixed 1 MiB limit. See http-api.md and integration-contract.md for validation order and recovery
        semantics.
      parameters:
      - name: X-Knotrel-Instance-Id
        in: header
        required: true
        description: Current process instance ID from GET /v1/info.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Successful feeder operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          description: Malformed JSON, missing/invalid instance header or invalid graph ID; session also rejects an
            invalid lease duration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '409':
          description: Mode, instance, session, lease, generation or source conflict; graph state may require rebuild.
            See ErrorCode for identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '413':
          description: Request body exceeds its limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '415':
          description: Content-Type is not application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '422':
          description: Invalid payload shape, operands or domain operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '503':
          description: The feeder control lane (session and heartbeat, 2 permits) is exhausted (`busy`), the graph
            worker is unavailable (`unavailable`), the server is draining (`shutting_down`) or the request timed out
            (`request_timeout`; a dispatched worker may still complete, so the outcome is uncertain). `busy` means
            nothing of the request was applied; retry later. This route never answers `import_in_progress`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
  /v1/feeder/import:
    post:
      operationId: feeder_import
      summary: Publish a complete graph atomically
      tags:
      - Feeder
      description: Builds a candidate before atomic publication. create_only requires generation 0; replace requires
        an exact composite If-Match token from GET /v1/stats. Successful publication advances generation, resets local
        revision and delivery sequence, and enters catching_up. One import permit is acquired before body consumption;
        the configurable KNOTREL_MAX_IMPORT_BODY_BYTES limit defaults to 64 MiB. Conflicting repeated node/edge flags
        are rejected. A timeout after worker dispatch can leave publication uncertain; reconcile before retrying.
        Available only in source_managed mode. Both the header and body instance_id must match the serving process.
        This is fencing, not authentication. Except for import, request bodies have a fixed 1 MiB limit. See http-api.md
        and integration-contract.md for validation order and recovery semantics.
      parameters:
      - name: X-Knotrel-Instance-Id
        in: header
        required: true
        description: Current process instance ID from GET /v1/info.
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: Required for mode=replace; one exact quoted composite ETag from /v1/stats. Missing or mismatching
          replacement preconditions return 412.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '201':
          description: Published graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Knotrel-Instance-Id:
              $ref: '#/components/headers/X-Knotrel-Instance-Id'
            X-Knotrel-Graph-Id:
              $ref: '#/components/headers/X-Knotrel-Graph-Id'
            X-Knotrel-Generation:
              $ref: '#/components/headers/X-Knotrel-Generation'
            X-Knotrel-State-Version:
              $ref: '#/components/headers/X-Knotrel-State-Version'
            X-Knotrel-Source-Position:
              $ref: '#/components/headers/X-Knotrel-Source-Position'
            X-Knotrel-Sync-Status:
              $ref: '#/components/headers/X-Knotrel-Sync-Status'
        '400':
          description: Malformed JSON, missing/invalid instance header or invalid graph ID; session also rejects an
            invalid lease duration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
        '409':
          description: Mode, instance, session, lease, generation or source conflict; graph state may require rebuild.
            See ErrorCode for identifiers.
