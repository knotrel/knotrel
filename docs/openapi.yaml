openapi: 3.1.0
info:
  title: Knotrel HTTP API
  version: 0.5.0
  description: |
    REST API for Knotrel, an in-memory dynamic graph connectivity service.

    Knotrel maintains an undirected simple graph in memory and answers dynamic connectivity
    queries across incremental edge/vertex insertions and deletions.

    For full operational semantics, trust model, and lifecycle details, see
    [http-api.md](http-api.md).
servers:
  - url: http://127.0.0.1:8080
    description: Default local server address

paths:
  /health:
    get:
      summary: Liveness probe
      description: |
        Process liveness probe. Returns HTTP 200 while the server process is functional.
        Never acquires the graph lock and stays 200 during graceful shutdown draining.
      tags:
        - Lifecycle
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok

  /ready:
    get:
      summary: Readiness probe
      description: |
        Reports whether the server is initialized and accepting graph operations.
        Does not acquire the graph lock or an admission permit. Always returns
        `Cache-Control: no-store`.
      tags:
        - Lifecycle
      responses:
        '200':
          description: Server is initialized and accepting graph work
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReadyResponse'
              example:
                status: ready
        '503':
          description: Server is not ready (starting up, draining for shutdown, or graph worker failed)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessNotReadyResponse'
              examples:
                starting:
                  summary: Starting up
                  value:
                    status: starting
                draining:
                  summary: Graceful shutdown in progress
                  value:
                    status: draining
                unavailable:
                  summary: Graph worker failed or panicked
                  value:
                    status: unavailable

  /metrics:
    get:
      summary: Prometheus metrics (opt-in)
      description: |
        Present only when the server is started with `KNOTREL_METRICS_ENABLED=true`;
        otherwise the route is not registered and returns 404. Unauthenticated, like
        every other route. Prometheus text format 0.0.4. Takes no graph lock and no
        admission or import permit. While draining it is still served, with
        `Connection: close`. See observability-contract.md for metric semantics.
      tags:
        - Lifecycle
      responses:
        '200':
          description: Current metrics
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
        '404':
          description: Metrics are disabled

  /v1/info:
    get:
      summary: Server configuration and metadata
      description: |
        Returns effective immutable configuration settings and engine selection.
        Does not acquire the graph lock or an admission permit.
      tags:
        - Metadata
      responses:
        '200':
          description: Effective server configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
              example:
                engine: compact-bfs
                experimental: false
                max_pending_jobs: 32
                max_body_bytes: 1048576
                max_batch_operations: 1024
                max_nodes: 100000
                max_edges: 500000

  /v1/stats:
    get:
      summary: Live graph state snapshot
      description: |
        Returns a coherent snapshot of the live graph's node and edge counts,
        configured capacity bounds, remaining capacity, and state revision.
        Acquires the graph lock on a blocking worker and shares the bounded admission queue.
        Always returns `Cache-Control: no-store`.
      tags:
        - Metadata
      responses:
        '200':
          description: Coherent graph snapshot
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSnapshot'
              example:
                node_count: 42000
                edge_count: 68000
                max_nodes: 100000
                max_edges: 500000
                remaining_nodes: 58000
                remaining_edges: 432000
                state_version: "157"
        '503':
          description: Request capacity exhausted (`busy`) or graph worker unavailable (`unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                busy:
                  summary: Queue saturated
                  value:
                    result: error
                    code: busy
                    message: "request capacity exhausted; retry later"
                unavailable:
                  summary: Worker unavailable
                  value:
                    result: error
                    code: unavailable
                    message: "graph worker unavailable"

  /v1/operations:
    post:
      summary: Execute a single graph operation
      description: |
        Executes a single graph mutation (`add_node`, `link`, `cut`) or query (`connected`)
        under exclusive graph lock. Request body must be valid JSON within 1 MiB.
        With `KNOTREL_TOPOLOGY_LIFECYCLE=true`, the lifecycle mutations `set_node_active`,
        `set_edge_enabled` and `remove_node` and the queries `node_state` and `edge_state`
        are also executed; without it they always parse but are rejected with 409
        `topology_lifecycle_disabled` before execution.
      tags:
        - Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Operation'
            examples:
              add_node:
                summary: Add isolated vertex
                value:
                  op: add_node
                  node: "1"
              link:
                summary: Insert undirected edge
                value:
                  op: link
                  source: "1"
                  target: "2"
              cut:
                summary: Remove undirected edge
                value:
                  op: cut
                  source: "1"
                  target: "2"
              connected:
                summary: Query connectivity
                value:
                  op: connected
                  source: "1"
                  target: "2"
              set_node_active:
                summary: Set a node flag (lifecycle support only)
                value:
                  op: set_node_active
                  node: "2"
                  active: false
              set_edge_enabled:
                summary: Set an edge flag (lifecycle support only)
                value:
                  op: set_edge_enabled
                  source: "1"
                  target: "2"
                  enabled: false
              remove_node:
                summary: Remove a node and its incident edges (lifecycle support only)
                value:
                  op: remove_node
                  node: "2"
              node_state:
                summary: Query a node's registration and flag (lifecycle support only)
                value:
                  op: node_state
                  node: "2"
              edge_state:
                summary: Query an edge's registration and flags (lifecycle support only)
                value:
                  op: edge_state
                  source: "1"
                  target: "2"
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChangedOutcome'
                  - $ref: '#/components/schemas/ConnectedOutcome'
                  - $ref: '#/components/schemas/NodeStateOutcome'
                  - $ref: '#/components/schemas/EdgeStateOutcome'
              examples:
                mutation_changed:
                  summary: Mutation applied (topology changed)
                  value:
                    result: changed
                    changed: true
                mutation_noop:
                  summary: Mutation applied as no-op (no change)
                  value:
                    result: changed
                    changed: false
                query_connected:
                  summary: Vertices are connected
                  value:
                    result: connected
                    connected: true
                query_disconnected:
                  summary: Vertices are disconnected
                  value:
                    result: connected
                    connected: false
                node_state:
                  summary: Registered inactive node
                  value:
                    result: node_state
                    registered: true
                    active: false
                edge_state:
                  summary: Registered enabled edge that is not effective
                  value:
                    result: edge_state
                    registered: true
                    enabled: true
                    effective: false
        '400':
          description: Malformed JSON syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "request body is not valid JSON"
        '404':
          description: |
            Unknown query vertex, or unknown node of `set_node_active` / `set_edge_enabled`
            (`unknown_node`); unregistered edge of `set_edge_enabled` (`unknown_edge`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                unknown_node:
                  summary: Unknown vertex
                  value:
                    result: error
                    code: unknown_node
                    message: "unknown node: 3"
                unknown_edge:
                  summary: Edge not registered (lifecycle support only)
                  value:
                    result: error
                    code: unknown_edge
                    message: "unknown edge: 1-3"
        '409':
          description: |
            Mutation sent in source-managed mode (`direct_mutation_disabled`), or lifecycle
            operation while lifecycle support is off (`topology_lifecycle_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                direct_mutation_disabled:
                  summary: Source-managed mode
                  value:
                    result: error
                    code: direct_mutation_disabled
                    message: "direct graph mutations are disabled in source-managed mode; use feeder endpoints"
                topology_lifecycle_disabled:
                  summary: Lifecycle support is off
                  value:
                    result: error
                    code: topology_lifecycle_disabled
                    message: "node and edge lifecycle support is disabled; set KNOTREL_TOPOLOGY_LIFECYCLE=true"
        '413':
          description: Request body exceeds 1 MiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "request body exceeded 1048576 bytes"
        '415':
          description: Missing or unsupported JSON Content-Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "Expected request with `Content-Type: application/json`"
        '422':
          description: Invalid request shape, self-loop, or capacity limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                shape:
                  summary: Missing required field or invalid format
                  value:
                    result: error
                    code: invalid_request
                    message: "missing field `op`"
                self_loop:
                  summary: Self-loop not permitted
                  value:
                    result: error
                    code: self_loop
                    message: "self-loops are not allowed"
                node_limit:
                  summary: Node capacity ceiling exceeded
                  value:
                    result: error
                    code: node_limit_exceeded
                    message: "node capacity limit exceeded"
                edge_limit:
                  summary: Edge capacity ceiling exceeded
                  value:
                    result: error
                    code: edge_limit_exceeded
                    message: "edge capacity limit exceeded"
        '503':
          description: Server busy, unavailable, shutting down, or request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                busy:
                  summary: Job queue capacity exhausted
                  value:
                    result: error
                    code: busy
                    message: "request capacity exhausted; retry later"
                unavailable:
                  summary: Graph worker failed or panicked
                  value:
                    result: error
                    code: unavailable
                    message: "graph worker unavailable"
                shutting_down:
                  summary: Server is draining
                  value:
                    result: error
                    code: shutting_down
                    message: "server is shutting down"

  /v1/batch:
    post:
      summary: Execute an ordered batch of graph operations
      description: |
        Executes between 1 and 1024 operations under a single graph lock acquisition.
        Results correspond one-to-one with the input operations.
        Batches do not provide rollback: subsequent failures do not revert earlier operations.
        Version headers on a 200 response are captured under the same lock acquisition and
        describe the state after the whole batch. Error responses carry no version headers.
        In source-managed mode, a batch containing any mutation is rejected with 409 before
        the batch size is checked. Without lifecycle support, a batch containing any
        lifecycle operation is rejected with 409 `topology_lifecycle_disabled` before the
        mode and size checks.
      tags:
        - Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            example:
              operations:
                - op: link
                  source: "1"
                  target: "2"
                - op: connected
                  source: "1"
                  target: "2"
                - op: cut
                  source: "1"
                  target: "2"
      responses:
        '200':
          description: Batch executed; per-operation outcomes returned in order
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Knotrel-Instance-Id:
              $ref: '#/components/headers/X-Knotrel-Instance-Id'
            X-Knotrel-Graph-Id:
              $ref: '#/components/headers/X-Knotrel-Graph-Id'
            X-Knotrel-Generation:
              $ref: '#/components/headers/X-Knotrel-Generation'
            X-Knotrel-State-Version:
              $ref: '#/components/headers/X-Knotrel-State-Version'
            X-Knotrel-Source-Position:
              $ref: '#/components/headers/X-Knotrel-Source-Position'
            X-Knotrel-Sync-Status:
              $ref: '#/components/headers/X-Knotrel-Sync-Status'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              example:
                results:
                  - result: changed
                    changed: true
                  - result: connected
                    connected: true
                  - result: changed
                    changed: true
        '400':
          description: Malformed JSON syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "request body is not valid JSON"
        '413':
          description: Request body exceeds 1 MiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "request body exceeded 1048576 bytes"
        '415':
          description: Missing or unsupported JSON Content-Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              example:
                result: error
                code: invalid_request
                message: "Expected request with `Content-Type: application/json`"
        '409':
          description: |
            Source-managed mode and the batch contains a mutation (`direct_mutation_disabled`),
            or lifecycle support is off and the batch contains a lifecycle operation
            (`topology_lifecycle_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                direct_mutation_disabled:
                  summary: Source-managed mode
                  value:
                    result: error
                    code: direct_mutation_disabled
                    message: "direct graph mutations are disabled in source-managed mode; use feeder endpoints"
                topology_lifecycle_disabled:
                  summary: Lifecycle support is off
                  value:
                    result: error
                    code: topology_lifecycle_disabled
                    message: "node and edge lifecycle support is disabled; set KNOTREL_TOPOLOGY_LIFECYCLE=true"
        '422':
          description: Invalid batch size (not 1–1024) or invalid operation shape in batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                batch_size:
                  summary: Batch size outside 1–1024
                  value:
                    result: error
                    code: invalid_batch_size
                    message: "batches must contain 1 to 1024 operations"
                shape:
                  summary: Invalid field or ID format in operation
                  value:
                    result: error
                    code: invalid_request
                    message: "node IDs must be nonempty strings of ASCII decimal digits"
        '503':
          description: |
            Server busy, unavailable, shutting down, or request timed out. After
            `request_timeout`, the effect of the batch is unknown: an admitted worker
            may still apply it later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOutcome'
              examples:
                busy:
                  summary: No graph job slot available; no operation was admitted
                  value:
                    result: error
                    code: busy
                    message: "request capacity exhausted; retry later"
                unavailable:
                  summary: Graph worker unavailable
                  value:
                    result: error
                    code: unavailable
                    message: "graph worker unavailable"
                shutting_down:
                  summary: Server is draining
                  value:
                    result: error
                    code: shutting_down
                    message: "server is shutting down; retry against another instance"
                request_timeout:
                  summary: Request time limit exceeded; effect unknown
                  value:
                    result: error
                    code: request_timeout
                    message: "request exceeded the server time limit; its effect is unknown"

components:
  headers:
    ETag:
      description: |
        Replacement token `"<generation>.<state_version>.<encoded source position>"`.
        The position segment is empty when no source position exists (standalone mode).
      schema:
        type: string
      example: '"1.0.pos-1"'
    X-Knotrel-Instance-Id:
      description: Identifier of the serving process instance.
      schema:
        type: string
    X-Knotrel-Graph-Id:
      description: Graph identifier; always `default`.
      schema:
        type: string
        const: default
    X-Knotrel-Generation:
      description: Published graph generation; `0` in standalone mode.
      schema:
        type: string
        pattern: '^[0-9]+$'
    X-Knotrel-State-Version:
      description: |
        Instance-local revision as an arbitrary-precision decimal string. It advances
        once per effective mutation (`changed: true`).
      schema:
        type: string
        pattern: '^[0-9]+$'
    X-Knotrel-Source-Position:
      description: Percent-encoded applied source position. Present only when one exists.
      schema:
        type: string
    X-Knotrel-Sync-Status:
      description: Synchronization status. Present only in source-managed mode.
      schema:
        type: string
        enum: [uninitialized, loading, catching_up, ready, stale, desynchronized]
  schemas:
    NodeId:
      type: string
      pattern: '^[0-9]+$'
      description: |
        Nonempty string of ASCII decimal digits representing an unsigned 64-bit integer
        (0 through 18446744073709551615). Leading zeroes are accepted and normalized.
      example: "42"

    AddNodeOperation:
      type: object
      required:
        - op
        - node
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [add_node]
        node:
          $ref: '#/components/schemas/NodeId'

    LinkOperation:
      type: object
      required:
        - op
        - source
        - target
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [link]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'

    CutOperation:
      type: object
      required:
        - op
        - source
        - target
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [cut]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'

    ConnectedOperation:
      type: object
      required:
        - op
        - source
        - target
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [connected]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'

    SetNodeActiveOperation:
      type: object
      description: Lifecycle support only. Sets the node's `active` flag.
      required:
        - op
        - node
        - active
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [set_node_active]
        node:
          $ref: '#/components/schemas/NodeId'
        active:
          type: boolean

    SetEdgeEnabledOperation:
      type: object
      description: Lifecycle support only. Sets the registered edge's `enabled` flag.
      required:
        - op
        - source
        - target
        - enabled
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [set_edge_enabled]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'
        enabled:
          type: boolean

    RemoveNodeOperation:
      type: object
      description: Lifecycle support only. Removes the node and every incident registered edge.
      required:
        - op
        - node
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [remove_node]
        node:
          $ref: '#/components/schemas/NodeId'

    NodeStateOperation:
      type: object
      description: Lifecycle support only. Query; an absent node is not an error.
      required:
        - op
        - node
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [node_state]
        node:
          $ref: '#/components/schemas/NodeId'

    EdgeStateOperation:
      type: object
      description: |
        Lifecycle support only. Query; an absent edge is not an error. `source == target`
        returns `self_loop`.
      required:
        - op
        - source
        - target
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [edge_state]
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'

    Operation:
      oneOf:
        - $ref: '#/components/schemas/AddNodeOperation'
        - $ref: '#/components/schemas/LinkOperation'
        - $ref: '#/components/schemas/CutOperation'
        - $ref: '#/components/schemas/ConnectedOperation'
        - $ref: '#/components/schemas/SetNodeActiveOperation'
        - $ref: '#/components/schemas/SetEdgeEnabledOperation'
        - $ref: '#/components/schemas/RemoveNodeOperation'
        - $ref: '#/components/schemas/NodeStateOperation'
        - $ref: '#/components/schemas/EdgeStateOperation'
      discriminator:
        propertyName: op

    ChangedOutcome:
      type: object
      required:
        - result
        - changed
      properties:
        result:
          type: string
          enum: [changed]
        changed:
          type: boolean
          description: True if graph connectivity structure changed; false for no-ops.

    ConnectedOutcome:
      type: object
      required:
        - result
        - connected
      properties:
        result:
          type: string
          enum: [connected]
        connected:
          type: boolean
          description: True if both vertices belong to the same connected component.

    NodeStateOutcome:
      type: object
      description: |
        Result of `node_state`. An absent node reports `registered: false` and
        `active: false`.
      required:
        - result
        - registered
        - active
      properties:
        result:
          type: string
          enum: [node_state]
        registered:
          type: boolean
        active:
          type: boolean

    EdgeStateOutcome:
      type: object
      description: |
        Result of `edge_state`. `effective` means enabled with both endpoints active. An
        absent edge reports `registered: false` and `false` flags.
      required:
        - result
        - registered
        - enabled
        - effective
      properties:
        result:
          type: string
          enum: [edge_state]
        registered:
          type: boolean
        enabled:
          type: boolean
        effective:
          type: boolean

    ErrorCode:
      type: string
      description: Machine-readable error code. Clients should branch on it, not on the message.
      enum:
        - barrier_not_reached
        - barrier_position_mismatch
        - busy
        - conflicting_duplicate
        - desynchronized
        - direct_mutation_disabled
        - edge_limit_exceeded
        - event_failed
        - fenced_feeder_session
        - generation_exhausted
        - graph_already_initialized
        - graph_desynchronized
        - graph_uninitialized
        - import_in_progress
        - invalid_batch_size
        - invalid_edge
        - invalid_graph_id
        - invalid_instance_id
        - invalid_lease_duration
        - invalid_node
        - invalid_request
        - lease_expired
        - loading
        - mode_conflict
        - node_limit_exceeded
        - out_of_order_sequence
        - payload_too_large
        - precondition_failed
        - request_timeout
        - self_loop
        - sequence_exhausted
        - session_required
        - shutting_down
        - source_epoch_mismatch
        - source_mismatch
        - source_predecessor_mismatch
        - stale_generation
        - stale_instance_id
        - superseded_barrier
        - topology_lifecycle_disabled
        - unavailable
        - uninitialized
        - unknown_edge
        - unknown_node
        - unverifiable_duplicate

    ErrorOutcome:
      type: object
      required:
        - result
        - code
        - message
      properties:
        result:
          type: string
          enum: [error]
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable error description.
          example: "unknown node: 3"

    Outcome:
      oneOf:
        - $ref: '#/components/schemas/ChangedOutcome'
        - $ref: '#/components/schemas/ConnectedOutcome'
        - $ref: '#/components/schemas/NodeStateOutcome'
        - $ref: '#/components/schemas/EdgeStateOutcome'
        - $ref: '#/components/schemas/ErrorOutcome'
      discriminator:
        propertyName: result

    BatchRequest:
      type: object
      required:
        - operations
      additionalProperties: false
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/Operation'

    BatchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Outcome'

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]

    ReadinessReadyResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ready]

    ReadinessNotReadyResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [starting, draining, unavailable]

    ServerInfo:
      type: object
      required:
        - engine
        - experimental
        - max_pending_jobs
        - max_body_bytes
        - max_batch_operations
        - max_nodes
        - max_edges
      properties:
        engine:
          type: string
          enum: [compact-bfs, ett, hdt]
          description: Configured connectivity engine.
        experimental:
          type: boolean
          description: Whether the engine is experimental.
        max_pending_jobs:
          type: integer
          description: Maximum queued plus running graph operations.
        max_body_bytes:
          type: integer
          description: Maximum allowed request body size in bytes.
        max_batch_operations:
          type: integer
          description: Maximum operations in a single batch request.
        max_nodes:
          type: [integer, "null"]
          description: Maximum node capacity bound, or null if unlimited.
        max_edges:
          type: [integer, "null"]
          description: Maximum edge capacity bound, or null if unlimited.
        topology_lifecycle:
          type: boolean
          const: true
          description: |
            Present, and `true`, only when node and edge lifecycle support is enabled
            (`KNOTREL_TOPOLOGY_LIFECYCLE=true`); absent otherwise.

    GraphSnapshot:
      type: object
      required:
        - node_count
        - edge_count
        - max_nodes
        - max_edges
        - remaining_nodes
        - remaining_edges
        - state_version
      properties:
        node_count:
          type: integer
          minimum: 0
          description: Current count of registered vertices, active or inactive.
        edge_count:
          type: integer
          minimum: 0
          description: Current count of registered undirected edges, enabled or disabled.
        active_node_count:
          $ref: '#/components/schemas/ActiveNodeCount'
        enabled_edge_count:
          $ref: '#/components/schemas/EnabledEdgeCount'
        effective_edge_count:
          $ref: '#/components/schemas/EffectiveEdgeCount'
        max_nodes:
          type: [integer, "null"]
          description: Configured node limit ceiling, or null if unlimited.
        max_edges:
          type: [integer, "null"]
          description: Configured edge limit ceiling, or null if unlimited.
        remaining_nodes:
          type: [integer, "null"]
          description: Remaining vertex capacity before reaching limit, or null if unlimited.
        remaining_edges:
          type: [integer, "null"]
          description: Remaining edge capacity before reaching limit, or null if unlimited.
        state_version:
          type: string
          description: Decimal string monotonic version counter incremented on effective mutations.

    ActiveNodeCount:
      type: integer
      minimum: 0
      description: Lifecycle support only. Registered nodes whose flag is active.

    EnabledEdgeCount:
      type: integer
      minimum: 0
      description: Lifecycle support only. Registered edges whose flag is enabled, effective or not.

    EffectiveEdgeCount:
      type: integer
      minimum: 0
      description: Lifecycle support only. Edges that are enabled and whose endpoints are both active.

    # Feeder payloads. The feeder routes (`/v1/feeder/*`) are specified in http-api.md and
    # integration-contract.md; the schemas below describe the lifecycle-relevant payloads.

    ImportNode:
      description: |
        One `nodes` entry of `POST /v1/feeder/import`: a node ID string (active), or an
        object with both members required. The object form requires lifecycle support even
        when `active` is `true`; otherwise the import is rejected with 409
        `topology_lifecycle_disabled`.
      oneOf:
        - $ref: '#/components/schemas/NodeId'
        - type: object
          required:
            - node
            - active
          additionalProperties: false
          properties:
            node:
              $ref: '#/components/schemas/NodeId'
            active:
              type: boolean

    ImportEdge:
      type: object
      description: |
        One `edges` entry of `POST /v1/feeder/import`. Missing endpoints are registered
        active. `enabled` (default `true`) requires lifecycle support even when `true`.
      required:
        - source
        - target
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'
        enabled:
          type: boolean
          default: true

    ImportRequest:
      type: object
      description: |
        Body of `POST /v1/feeder/import`. It must carry the complete registered topology,
        including isolated and inactive nodes and disabled edges. Repeated entries must
        agree; a conflicting flag is 422 `invalid_node` or `invalid_edge`.
      required:
        - mode
        - instance_id
        - graph_id
        - source_id
        - source_epoch
        - source_position
        - feeder_session_id
        - feeder_epoch
        - nodes
        - edges
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [create_only, replace]
        instance_id:
          type: string
        graph_id:
          type: string
          const: default
        source_id:
          type: string
        source_epoch:
          type: string
        source_position:
          type: string
        feeder_session_id:
          type: string
        feeder_epoch:
          type: integer
          minimum: 0
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ImportNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ImportEdge'

    ImportResponse:
      type: object
      description: Successful import publication (`201 Created`).
      required:
        - result
        - instance_id
        - graph_id
        - generation
        - state_version
        - node_count
        - edge_count
        - source_position
        - status
      properties:
        result:
          type: string
          enum: [published]
        instance_id:
          type: string
        graph_id:
          type: string
          const: default
        generation:
          type: integer
          minimum: 1
        state_version:
          type: string
          pattern: '^[0-9]+$'
        node_count:
          type: integer
          minimum: 0
          description: Registered nodes.
        edge_count:
          type: integer
          minimum: 0
          description: Registered edges.
        active_node_count:
          $ref: '#/components/schemas/ActiveNodeCount'
        enabled_edge_count:
          $ref: '#/components/schemas/EnabledEdgeCount'
        effective_edge_count:
          $ref: '#/components/schemas/EffectiveEdgeCount'
        source_position:
          type: string
        status:
          type: string
          enum: [uninitialized, loading, catching_up, ready, stale, desynchronized]

    FeederEvent:
      type: object
      description: |
        One event of `POST /v1/feeder/events`. Required and forbidden operands by `op`:
        `add_node` needs `node`; `link` and `cut` need `source` and `target`; `progress`
        has no operand; `set_node_active` needs `node` and `active`; `set_edge_enabled`
        needs `source`, `target` and `enabled`; `remove_node` needs `node`. Any other
        operand is forbidden (422 `invalid_request`), so `active` and `enabled` are
        rejected on `add_node`, `link`, `cut` and `progress` whatever the setting. The three
        lifecycle operations require lifecycle support; otherwise the whole request is
        rejected with 409 `topology_lifecycle_disabled`.
      required:
        - event_id
        - delivery_sequence
        - prev_delivery_sequence
        - source_position
        - prev_source_position
        - op
      additionalProperties: false
      properties:
        event_id:
          type: string
          description: At most 64 bytes of UTF-8.
        delivery_sequence:
          type: integer
          minimum: 0
        prev_delivery_sequence:
          type: integer
          minimum: 0
        source_position:
          type: string
          description: At most 256 bytes of UTF-8.
        prev_source_position:
          type: string
          description: At most 256 bytes of UTF-8.
        op:
          type: string
          enum: [add_node, link, cut, progress, set_node_active, set_edge_enabled, remove_node]
        node:
          $ref: '#/components/schemas/NodeId'
        source:
          $ref: '#/components/schemas/NodeId'
        target:
          $ref: '#/components/schemas/NodeId'
        active:
          type: boolean
          description: Required on `set_node_active`; forbidden on every other operation.
        enabled:
          type: boolean
          description: Required on `set_edge_enabled`; forbidden on every other operation.
