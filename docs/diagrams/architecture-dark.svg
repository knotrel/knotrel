<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Knotrel source-managed architecture</title><desc id="desc">An external authoritative source sends data to a feeder, which sends updates to the Knotrel server. An application queries the server and the console inspects it.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#a2c9e9"/></marker></defs><rect width="960" height="300" rx="12" fill="#192230"/><g fill="#253449" stroke="#7896b2" stroke-width="2"><rect x="30" y="92" width="180" height="80" rx="10"/><rect x="275" y="92" width="160" height="80" rx="10"/><rect x="510" y="92" width="175" height="80" rx="10" fill="#244b4a" stroke="#67c5a6"/><rect x="760" y="25" width="165" height="80" rx="10"/><rect x="760" y="165" width="165" height="80" rx="10" fill="#244b4a" stroke="#67c5a6"/></g><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#e7edf5"><text x="120" y="122" font-weight="700">Authoritative source</text><text x="120" y="147" font-size="13">External · persistent</text><text x="355" y="122" font-weight="700">Feeder (external)</text><text x="355" y="147" font-size="13">External process</text><text x="598" y="122" font-weight="700">Knotrel server</text><text x="598" y="147" font-size="13">Derived graph · RAM</text><text x="842" y="60" font-weight="700">Application (external)</text><text x="842" y="85" font-size="13">Connectivity queries</text><text x="842" y="200" font-weight="700">Knotrel Console</text><text x="842" y="225" font-size="13">Inspect and diagnose</text></g><g stroke="#a2c9e9" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M210 132H270"/><path d="M435 132H505"/><path d="M760 65H720V112H690"/><path d="M760 205H720V152H690"/></g><g font-family="system-ui,sans-serif" font-size="12" fill="#a2c9e9" text-anchor="middle"><text x="242" y="120">Changes</text><text x="470" y="120">Updates</text></g><g font-family="system-ui,sans-serif" font-size="13" fill="#e7edf5"><rect x="30" y="258" width="18" height="18" rx="4" fill="#244b4a" stroke="#67c5a6" stroke-width="2"/><text x="58" y="272">Knotrel components</text></g></svg>
