- change: "POST /v1/feeder/import request.source_position: request constraint tightened (minLength None -> 1)"
  release: "v1.0.0"
  justification: "Stricter input validation, approved by the maintainer on 2026-11-22 as an exception without a deprecation window (v1.0 contract freeze review, docs/releases/v1.0-contract-freeze-review.md, decision 6, finding H5): the documented bound (1 to 256 bytes for source positions, at most 64 bytes for event_id, since v0.6.0 in docs/integration-contract.md and docs/http-api.md) is now enforced on every field it applies to. The server counts UTF-8 bytes; OpenAPI minLength/maxLength count characters. Declared in docs/compatibility.md, section 3."
