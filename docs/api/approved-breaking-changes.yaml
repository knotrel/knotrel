# Breaking changes to stable HTTP operations approved by the maintainer
# (docs/compatibility.md, section 6). One entry per message printed by
# scripts/check-openapi-compat.py:
#
# - change: "<exact message>"
#   release: "v0.X.0"
#   justification: "<deprecated in v0.Y.0; why; link>"
- change: "GET /v1/nodes: stable operation marked experimental"
  release: "v0.9.0"
  justification: "Opt-in inspection route added in v0.8.0, before any stability promise; classified Experimental in docs/stability.md, approved by the maintainer on 2026-11-21 (roadmap 0.9.4). Not a removal: the route is unchanged."
