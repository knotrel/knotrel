<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page.title | default: site.title }} · Knotrel</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('knotrel-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script><link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}"></head><body><header><a class="brand" href="{{ '/' | relative_url }}">Knotrel <span>Docs</span></a><nav><a href="{{ '/architecture-site.html' | relative_url }}">Architecture</a><a href="{{ '/console.html' | relative_url }}">Console</a><a href="{{ '/http-api.html' | relative_url }}">HTTP API</a><a href="https://github.com/knotrel/knotrel">GitHub</a></nav><button id="theme" type="button">Switch theme</button></header><main>{{ content }}</main><footer>Documentation lives alongside the <a href="https://github.com/knotrel/knotrel">Knotrel source</a>.</footer><script>document.getElementById('theme').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('knotrel-theme',t)}catch(e){}}</script></body></html>
