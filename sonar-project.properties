sonar.projectKey=knotrel_knotrel
sonar.organization=knotrel

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=knotrel
sonar.projectVersion=0.1.0

# Path to source code and tests
sonar.sources=crates
sonar.tests=crates/knotrel-core/tests,crates/knotrel-server/tests

# Inclusions and exclusions
sonar.exclusions=**/target/**,scripts/**,docs/**,examples/**
sonar.coverage.exclusions=**/*test*/**,crates/*/tests/**,examples/**,scripts/**,docs/**

# Coverage reports
sonar.rust.lcov.reportPaths=lcov.info
sonar.coverage.reportPaths=lcov.info

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8