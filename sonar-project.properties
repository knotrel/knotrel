sonar.projectKey=knotrel_knotrel
sonar.organization=knotrel

# Display name. The version is passed by .github/workflows/sonar.yml from the
# workspace version in Cargo.toml, so it cannot go stale here.
sonar.projectName=knotrel

# One project, one combined scan: Rust crates and the operational console.
sonar.sources=crates/knotrel-core/src,crates/knotrel-server/src,console/src,console/scripts,console/container
sonar.tests=crates/knotrel-core/tests,crates/knotrel-server/tests,console/test,console/e2e

# Build output, dependencies and generated code are not analyzed.
#   console/src/api/generated: produced from docs/openapi.yaml by openapi-typescript.
sonar.exclusions=**/target/**,console/node_modules/**,console/dist/**,console/coverage/**,console/src/api/generated/**
sonar.coverage.exclusions=**/*test*/**,crates/*/tests/**,examples/**,scripts/**,docs/**,crates/knotrel-server/src/main.rs,console/scripts/**,console/container/**,console/e2e/**,console/src/env.d.ts
# Rationale for console coverage exclusions: console/scripts are build and
# release tooling exercised by CI jobs, console/container is nginx and shell
# configuration verified by the container smoke test, and env.d.ts only
# declares a build-time constant.

# Coverage reports (both must exist before the scan; see sonar.yml).
sonar.rust.lcov.reportPaths=lcov.info
sonar.javascript.lcov.reportPaths=console/coverage/lcov.info

sonar.sourceEncoding=UTF-8
